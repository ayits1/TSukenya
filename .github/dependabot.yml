version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vitest:
        patterns: ['vitest', '@vitest/*']
    ignore:
      # Types follow the Node runtime pinned in .nvmrc (24); a newer major describes APIs production lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (native) has no JS compiler API yet; openapi-typescript and the lint/build tools need it.
      - dependency-name: 'typescript'
        versions: ['>=7']
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
