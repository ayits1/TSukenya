name: Server quick checks
# Accounting, roles and the legacy browser adapter: Django tests on disposable SQLite
# plus dependency-free Node scenarios. PostgreSQL concurrency and browsers stay in the
# manual full check (quality.yml / npm run test:full).
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'app/**'
      - 'manage.py'
      - '.nvmrc'
      - '.github/workflows/server-quick.yml'
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'app/**'
      - 'manage.py'
      - '.nvmrc'
      - '.github/workflows/server-quick.yml'
permissions:
  contents: read
concurrency:
  group: server-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -r server/requirements.txt
      - name: Isolated data paths
        # Disposable SQLite only; production database variables are never set here.
        run: |
          echo "DATA_DIR=$RUNNER_TEMP/tsukenya-data" >> "$GITHUB_ENV"
          echo "ERP_DB_PATH=$RUNNER_TEMP/tsukenya-test.sqlite3" >> "$GITHUB_ENV"
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Server tests (SQLite)
        run: python manage.py test tests --noinput
      - name: Browser adapter and legacy module scenarios
        run: |
          for scenario in sync-sim.js catalog-import-parser.cjs csv-format.cjs runtime-recovery.cjs promotion-legacy.cjs; do
            echo "::group::$scenario"
            node "tests/$scenario"
            echo "::endgroup::"
          done
