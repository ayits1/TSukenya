<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мережа солодощів — панель власника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF5F1; --paper:#FFFFFF; --ink:#2B1830; --muted:#6D5B70; --line:#D6E2DB;
  --rasp:#C8235F; --rasp-soft:#FBE3EC; --caramel:#D98E1F; --caramel-soft:#FCEFD9;
  --mint:#2F9670; --mint-soft:#DDF2E8; --focus:#C8235F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1220; --paper:#251A2C; --ink:#F3EAF4; --muted:#B6A6B9; --line:#3B2D44;
    --rasp:#FF5C93; --rasp-soft:#3F1B2C; --caramel:#F0B558; --caramel-soft:#3A2B17;
    --mint:#5CCB9D; --mint-soft:#18342A; --focus:#FF5C93;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1220; --paper:#251A2C; --ink:#F3EAF4; --muted:#B6A6B9; --line:#3B2D44;
  --rasp:#FF5C93; --rasp-soft:#3F1B2C; --caramel:#F0B558; --caramel-soft:#3A2B17;
  --mint:#5CCB9D; --mint-soft:#18342A; --focus:#FF5C93;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:28px}
.top .sub{font-size:.95rem}
.notice{background:var(--caramel-soft);border-left:4px solid var(--caramel);padding:12px 14px;border-radius:8px;margin-bottom:20px}

/* candy path — the one memorable element */
.path{background:var(--paper);border-radius:22px;padding:28px 24px 24px;margin-bottom:18px}
.path-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.stages::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:4px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px}
.candy{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:var(--paper);border:3px solid var(--line);color:var(--muted);z-index:1}
.candy::before,.candy::after{content:"";position:absolute;top:50%;width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;transform:translateY(-50%)}
.candy::before{left:-15px;border-right:14px solid var(--line)}
.candy::after{right:-15px;border-left:14px solid var(--line)}
.stage.done .candy{background:var(--mint);border-color:var(--mint);color:#fff}
.stage.done .candy::before{border-right-color:var(--mint)} .stage.done .candy::after{border-left-color:var(--mint)}
.stage.now .candy{background:var(--rasp);border-color:var(--rasp);color:#fff;transform:scale(1.18)}
.stage.now .candy::before{border-right-color:var(--rasp)} .stage.now .candy::after{border-left-color:var(--rasp)}
.stage-name{margin-top:14px;font-weight:600;font-size:.98rem}
.stage.now .stage-name{color:var(--rasp)}
.stage-meta{font-size:.85rem;color:var(--muted)}
.next{display:flex;gap:14px;align-items:flex-start;background:var(--rasp-soft);border-radius:14px;padding:16px 18px;margin-top:26px}
.next b{display:block;margin-bottom:2px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;margin:26px 0 18px}
.tab{border:0;background:transparent;padding:10px 16px;border-radius:999px;font-weight:500;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--paper);border-radius:18px;padding:22px}
.panel+.panel{margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.gap-lg{margin-bottom:18px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .v{font-size:1.5rem;font-weight:600}
.stat .l{font-size:.9rem;color:var(--muted)}

/* controls */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:500;background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--bg);color:var(--ink)}
.btn.rasp{background:var(--rasp);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input:not([type]),select{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;min-width:0}
input[type=number]{width:96px;text-align:right}
label.inl{display:inline-flex;gap:8px;align-items:center}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.9rem}
td.r,th.r{text-align:right}
.badge{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--caramel-soft);color:var(--caramel);margin-left:6px}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--rasp)}

/* tasks */
.stage-block+.stage-block{margin-top:22px}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{flex:1}
.task.done .t{color:var(--muted);text-decoration:line-through}
.chip{border:0;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:500;min-width:92px}
.chip.todo{background:var(--bg);color:var(--muted)}
.chip.doing{background:var(--caramel-soft);color:var(--caramel)}
.chip.done{background:var(--mint-soft);color:var(--mint)}

/* ideas */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.idea{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.idea.yes{border-color:var(--mint);background:var(--mint-soft)}
.idea.no{opacity:.6}
.idea .acts{display:flex;gap:8px;margin-top:auto}

/* expenses */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.exp{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.exp .n{flex:1}
.foot{margin:28px 0 8px;font-size:.85rem;text-align:center}
.hid summary{cursor:pointer;font-weight:600;font-size:1.05rem}
.hid summary::marker{color:var(--muted)}
.total{display:flex;justify-content:space-between;padding-top:10px;font-weight:600}
.be{background:var(--mint-soft);border-radius:14px;padding:18px;margin-top:18px}
.be .big{font-size:1.8rem;font-weight:700}

/* price tags */
.pick{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.pick .prow{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.pick .prow:last-child{border-bottom:0}
.pick .prow label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;padding:2px 0}
.pick .qty{width:64px;text-align:center}
.pick .prow:not(.on) .qty{opacity:.45}
.qbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body>*:not(#printArea){display:none!important}
  body{background:#fff!important;margin:0!important;padding:0!important}
  #printArea{display:flex!important;flex-wrap:wrap}
  #printArea .tag{box-sizing:border-box;break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .tag.b-none{border-color:#eee}
}
.preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;background:#fff;padding:12px;border-radius:12px;color:#1c1c1c}
.tag{--k:1;--n:1;--g:1;--q:1;border:1px dashed #999;padding:calc(2mm*var(--k)) calc(3mm*var(--k));display:flex;flex-direction:column;justify-content:space-between;font-family:"Rubik",Arial,sans-serif;background:#fff;color:#1c1c1c;box-sizing:border-box;overflow:hidden}
.tag.b-solid{border-style:solid;border-color:#555}.tag.b-none{border-color:transparent}
.tag.s{width:58mm;height:40mm}.tag.m{--k:1.25;width:75mm;height:50mm}.tag.l{--k:1.65;width:100mm;height:70mm}
.tag .t-hd{display:flex;justify-content:space-between;gap:2mm;font-size:calc(7pt*var(--k)*var(--g)*var(--x,1));color:#777;line-height:1.2}
.tag .t-hd span:last-child{text-align:right}
.tag .t-cu{font-size:calc(8pt*var(--k)*var(--g)*var(--x,1));font-weight:700;color:#c2185b;line-height:1.2;margin-top:.5mm}
.tag .nm{font-size:calc(10pt*var(--k)*var(--n)*var(--x,1));font-weight:600;line-height:1.15;margin-top:.8mm;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag .nm.big{font-size:calc(12.5pt*var(--k)*var(--n)*var(--x,1))}
.tag .t-pk{font-size:calc(7.5pt*var(--k)*var(--g)*var(--x,1));color:#555;line-height:1.2;margin-top:.5mm}
.tag .t-top{min-height:0;overflow:hidden}
.tag .pr{font-size:calc(22pt*var(--k)*var(--q)*var(--x,1));font-weight:700;line-height:1}
.tag .pr small{font-size:.45em;font-weight:600;margin-left:1mm}
.tag .un{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(8pt*var(--k)*var(--n)*var(--x,1));color:#444;line-height:1.3}
.tag .ft{display:flex;justify-content:space-between;font-size:calc(7pt*var(--k)*var(--g)*var(--x,1));color:#777;line-height:1.2}
.tcfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:6px}
@media (max-width:760px){.tcfg{grid-template-columns:minmax(0,1fr)}}
.tcfg h4{margin:0 0 8px;font-size:14px}
.tels{display:flex;flex-wrap:wrap;gap:6px 14px}
.tels label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.tcfg .row{margin-top:10px}
.stl{display:flex;flex-direction:column;gap:6px}
.stl .strow{display:flex;gap:6px;align-items:center}
.stl .strow input{flex:1;min-width:0}
.tsample{display:flex;justify-content:center;align-items:center;background:#fff;border-radius:12px;padding:14px;margin-top:12px;overflow:auto}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500}
.tchip[aria-pressed="true"]{background:var(--rasp);border-color:var(--rasp);color:var(--bg)}
.imp-opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0}
.warn{background:var(--rasp-soft);border-left:4px solid var(--rasp);padding:10px 12px;border-radius:8px}
a.btn{display:inline-block;text-decoration:none;line-height:1.5}
#linkBox a:not(.btn){color:var(--rasp);font-weight:600}
.gs{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.gsl{margin-top:10px;max-height:280px;overflow:auto}
.gsrow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.gsrow:last-child{border-bottom:0}
.gst{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsok{margin-top:10px;background:var(--mint-soft);border-left:4px solid var(--mint);padding:10px 12px;border-radius:8px}
.gsok a{color:inherit;font-weight:600}
.fbar{position:relative;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fbar #facets{display:contents}
.fbar input#q{width:190px;height:38px}
.fcount{margin-left:auto;font-size:.9rem;white-space:nowrap}
.fclear{height:38px;padding:0 14px}
.dd{position:relative}
.dd-btn{height:38px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;max-width:230px;font-weight:500}
.dd-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-caret{font-size:.8rem;color:var(--muted);transition:transform .15s}
.dd.open .dd-caret{transform:rotate(180deg)}
.dd.active .dd-btn{border-color:var(--rasp);background:var(--rasp-soft);color:var(--rasp)}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:230px;max-width:min(320px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.dd-list{max-height:260px;overflow:auto}
.dd-opt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.dd-opt:hover{background:var(--bg)}
.dd-opt.zero{opacity:.45}
.dd-t{flex:1}
.dd-n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.dd-clear{border:0;background:transparent;color:var(--rasp);padding:4px 8px;font-weight:500;font-size:.9rem}
.dd-stale{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:6px;padding:10px 8px 4px;font-size:.9rem;color:var(--muted)}
@media (max-width:640px){.dd{position:static}.dd-pop{left:0;right:0;max-width:none}.fbar input#q{width:100%}.fcount{margin-left:0}}
.badge.bad{background:var(--rasp-soft);color:var(--rasp)}
.w-size{width:96px}
@media (max-width:640px){.flabel{width:100%}}
.pick-grp{font-weight:600;color:var(--rasp);padding:10px 0 4px;position:sticky;top:0;background:var(--paper)}
tr.sgrp td{font-weight:600;color:var(--rasp);padding:8px 8px 4px;border-bottom:0}
tr.grp th{background:var(--bg);color:var(--ink);font-size:.95rem;padding:10px 8px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:640px){
  .wrap{padding:16px 12px 48px}
  .stages{grid-template-columns:1fr;gap:18px}
  .stages::before{left:21px;right:auto;top:10px;bottom:10px;width:4px;height:auto;background:repeating-linear-gradient(180deg,var(--line) 0 10px,transparent 10px 16px)}
  .stage{flex-direction:row;align-items:center;text-align:left;gap:18px;padding:0}
  .stage-name{margin-top:0}
  .panel{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="chainName">Мережа солодощів</h1>
      <p class="sub muted">Панель власника: де ми зараз і що робимо далі</p>
    </div>
    <p class="muted sub" id="updated"></p>
  </header>

  <div id="noDb" class="notice" hidden>Дані ще завантажуються. Якщо панель лишається порожньою, відкрийте її з чату Claude, де її створено.</div>

  <section class="path" aria-labelledby="pathTitle">
    <div class="path-head">
      <h2 id="pathTitle">Де ми зараз</h2>
      <span class="muted" id="overall"></span>
    </div>
    <ol class="stages" id="stages"></ol>
    <div class="next" id="next" hidden>
      <div><b>Наступний крок</b><span id="nextText"></span></div>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">Огляд</button>
    <button class="tab" role="tab" data-tab="tasks" aria-selected="false">Задачі</button>
    <button class="tab" role="tab" data-tab="ideas" aria-selected="false">Ідеї від Claude</button>
    <button class="tab" role="tab" data-tab="products" aria-selected="false">Товари і ціни</button>
    <button class="tab" role="tab" data-tab="tags" aria-selected="false">Цінники</button>
    <button class="tab" role="tab" data-tab="expenses" aria-selected="false">Витрати</button>
  </nav>

  <main id="main"></main>
  <footer class="foot muted" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const APP_VERSION = "1.1.0"; // разом із CHANGELOG.md
  const STAGES = [
    {n:1, name:"База товарів і витрат"},
    {n:2, name:"Цінники з накладних"},
    {n:3, name:"Міні-CRM"},
    {n:4, name:"Інтернет-вітрина"}
  ];
  const S = {settings:{}, project:{}, tasks:[], ideas:[], products:[], allProducts:[], expenses:[], tagSel:new Set(), tagQty:{}, F:{prod:newF(), tags:newF()}};
  const TYPES = ["Напої","Цукерки","Печиво і вафлі","Торти і десерти","Інше"];
  const NOTYPE = "Без типу";
  const typeOf = p => p.type || NOTYPE;
  const allTypes = () => [...TYPES, ...new Set(S.products.map(typeOf).filter(t=>t!==NOTYPE && !TYPES.includes(t)))];
  const UK = new Intl.Collator("uk");
  const typeRanker = () => { const m = new Map(allTypes().map((t,i)=>[t,i])); return t => m.has(t) ? m.get(t) : 999; }; // порядок груп рахуємо раз на сортування
  const sortByType = list => { const rank = typeRanker(); return list.slice().sort((a,b)=> rank(typeOf(a))-rank(typeOf(b)) || UK.compare(String(a.category||""), String(b.category||"")) || UK.compare(String(a.name), String(b.name))); };
  const typeOpts = cur => { const l = allTypes(); if (cur && cur!==NOTYPE && !l.includes(cur)) l.push(cur); return (cur===NOTYPE?`<option value="" selected>${NOTYPE}</option>`:"") + l.map(t=>`<option ${t===cur?"selected":""}>${esc(t)}</option>`).join(""); };
  let db = null, downloads = null, mcp = null, tab = "overview", pending = false;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const money = v => (Math.round(v*100)/100).toLocaleString("uk-UA",{minimumFractionDigits:2,maximumFractionDigits:2});
  const money0 = v => Math.round(v).toLocaleString("uk-UA");
  const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };

  /* ---------- filters model ---------- */
  const NOPACK = "Без пакування", NOSIZE = "Без розміру", NOCAT = "Без категорії";
  const UNITS = [["шт","шт — штука"],["кг","кг — кілограм (ваговий)"],["100 г","100 г"],["уп","уп — упаковка"],["пач","пач — пачка"],["кор","кор — коробка"],["л","л — літр (розлив)"],["порц","порц — порція"],["набір","набір"]];
  const unitOpts = v => (UNITS.some(u=>u[0]===v) ? UNITS : [[v,v],...UNITS]).map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(k)}</option>`).join("");
  const unitPhrase = u => { u = u || "шт"; return u==="100 г" ? "грн за 100 г" : `грн за 1 ${u}`; };
  const PACKS = ["Банка","ПЕТ","Скло","Стакан","Коробка","Пакет","Упаковка","Ваговий","Штучно"];
  const CUPS = ["S","M","L","XL","XXL","3XL"];
  const PRICE_LABEL = {ok:"Актуальна ціна", stale:"Застаріла ціна", none:"Немає ціни"};
  const today = () => new Date().toISOString().slice(0,10);
  const catKey = p => p.category || NOCAT;
  const packKey = p => p.pack || NOPACK;
  const sizeKey = p => p.size || NOSIZE;
  const allPacks = () => [...PACKS, ...new Set(S.products.map(p=>p.pack).filter(x=>x && !PACKS.includes(x)))];
  function newF(){ return {q:"", types:new Set(), cats:new Set(), packs:new Set(), sizes:new Set(), price:new Set()}; }
  const FACETS = [
    {k:"types", label:"Група", val:typeOf},
    {k:"cats", label:"Категорія", val:catKey},
    {k:"packs", label:"Пакування", val:packKey},
    {k:"sizes", label:"Розмір", val:sizeKey},
    {k:"price", label:"Ціна", val:priceState}];
  const curF = () => S.F[tab==="tags" ? "tags" : "prod"];
  const isActive = f => !!f.q.trim() || FACETS.some(fc=>f[fc.k].size>0);
  function matches(p, f, skip){
    const q = f.q.trim().toLowerCase();
    if (q && !String(p.name).toLowerCase().includes(q)) return false;
    for (const fc of FACETS){ if (fc.k===skip) continue; const st = f[fc.k]; if (st.size && !st.has(fc.val(p))) return false; }
    return true;
  }
  const filtered = f => S.products.filter(p=>matches(p,f,null));
  function sizeRank(v){
    if (v===NOSIZE) return 1e9;
    const ci = CUPS.indexOf(String(v).toUpperCase()); if (ci>=0) return 5e4+ci;
    const m = String(v).match(/^\s*(\d+(?:[.,]\d+)?)\s*(мл|л|кг|г)/i);
    if (m){ let x = parseFloat(m[1].replace(",",".")); const u = m[2].toLowerCase(); if (u==="мл"||u==="г") x/=1000; return ((u==="л"||u==="мл") ? 0 : 1e4) + x; }
    return 1e5;
  }
  function facetEntries(fc, f){
    const m = new Map();
    if (fc.k==="price") ["ok","stale","none"].forEach(k=>m.set(k,0));
    S.products.forEach(p=>{ const v = fc.val(p); if (!m.has(v)) m.set(v,0); });
    S.products.filter(p=>matches(p,f,fc.k)).forEach(p=>{ const v = fc.val(p); m.set(v,(m.get(v)||0)+1); });
    const last = {types:NOTYPE, cats:NOCAT, packs:NOPACK, sizes:NOSIZE}[fc.k];
    const pl = allPacks(), po = x => pl.indexOf(x)<0 ? 99 : pl.indexOf(x), PO = ["ok","stale","none"], rank = typeRanker();
    const ord = {
      types:(a,b)=>rank(a)-rank(b),
      cats:(a,b)=>a.localeCompare(b,"uk"),
      packs:(a,b)=>po(a)-po(b),
      sizes:(a,b)=>sizeRank(a)-sizeRank(b) || a.localeCompare(b,"uk"),
      price:(a,b)=>PO.indexOf(a)-PO.indexOf(b)}[fc.k];
    return [...m.entries()].sort((a,b)=> (a[0]===last)-(b[0]===last) || ord(a[0],b[0]));
  }
  function ddLabel(fc, f){
    const st = f[fc.k]; if (!st.size) return fc.label;
    const arr = [...st];
    return `${fc.label}: ${arr.length===1 ? (fc.k==="price" ? PRICE_LABEL[arr[0]] : arr[0]) : arr.length+" обрано"}`;
  }
  function facetRow(fc, f){
    const ents = facetEntries(fc, f), st = f[fc.k];
    if (fc.k!=="price" && ents.length<=1 && !st.size) return "";
    const open = S.openF===fc.k;
    const opts = ents.map(([v,n])=>`<label class="dd-opt${n===0&&!st.has(v)?" zero":""}"><input type="checkbox" data-f="${fc.k}" data-v="${esc(v)}" ${st.has(v)?"checked":""}><span class="dd-t">${esc(fc.k==="price"?PRICE_LABEL[v]:v)}</span><span class="dd-n">${n}</span></label>`).join("");
    const extra = fc.k==="price" ? `<label class="dd-stale" title="Для товарів із закупівлею — від дня, коли її востаннє вносили (накладна, таблиця чи правка); зміна націнки цю дату не оновлює.">Застаріла — старіша за <select id="staleDays" aria-label="Через скільки днів ціна вважається застарілою">${[7,14,30,60,90].map(d=>`<option value="${d}" ${d===staleDays()?"selected":""}>${d} днів</option>`).join("")}</select></label>` : "";
    return `<div class="dd${open?" open":""}${st.size?" active":""}"><button type="button" class="dd-btn" data-ddtoggle="${fc.k}" aria-expanded="${open}" aria-haspopup="true"><span class="dd-l">${esc(ddLabel(fc,f))}</span><span class="dd-caret" aria-hidden="true">▾</span></button>${open ? `<div class="dd-pop" role="group" aria-label="${fc.label}">${st.size?`<button type="button" class="dd-clear" data-fclear="${fc.k}">Очистити вибір</button>`:""}<div class="dd-list">${opts}</div>${extra}</div>` : ""}</div>`;
  }
  const facetsHtml = f => FACETS.map(fc=>facetRow(fc,f)).join("");
  const countText = f => `${filtered(f).length} з ${S.products.length}`;
  function filterBar(f){
    return `<div class="fbar"><input id="q" type="text" placeholder="Пошук за назвою" value="${esc(f.q)}" aria-label="Пошук за назвою"><div id="facets">${facetsHtml(f)}</div><span class="fcount muted" id="fcount" title="Показано товарів з усіх">${countText(f)}</span><button type="button" class="btn soft fclear" id="fResetBtn" data-act="fReset" ${isActive(f)?"":"hidden"}>Скинути</button></div>`;
  }
  function refreshFilters(foc){
    const f = curF(), list = filtered(f);
    const fx = $("#facets"); if (fx) fx.innerHTML = facetsHtml(f);
    if (foc && fx){ const e = [...fx.querySelectorAll("[data-f],[data-ddtoggle]")].find(x=> foc.k ? (x.dataset.f===foc.k && x.dataset.v===foc.v) : x.dataset.ddtoggle===foc.t); if (e) e.focus(); }
    const c = $("#fcount"); if (c) c.textContent = countText(f);
    const r = $("#fResetBtn"); if (r) r.hidden = !isActive(f);
    const pl = $("#prodList"); if (pl) pl.innerHTML = productList(list);
    const pk = $("#pickBox"); if (pk) pk.innerHTML = pickList(list);
    if (tab==="tags") renderPreview();
  }

  function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2200); }

  /* ---------- pricing ---------- */
  /* CALC-START */
  // Ціни, маржа, застарілість і беззбитковість. Залежать лише від S.settings і num — їх перевіряють tests/calc.test.js.
  const defMarkup = () => S.settings.defaultMarkup ?? 30;
  function roundPrice(x){ const r = S.settings.rounding ?? 0.5; return Math.ceil(x/r - 1e-9)*r || 0; } // || 0: без закупівлі виходить -0, а його друкують як «-0»
  function priceOf(p){
    if (p.manualPrice && p.price != null) return num(p.price);
    const m = p.markup ?? defMarkup();
    return roundPrice(num(p.cost)*(1+num(m)/100));
  }
  const marginOf = p => { const pr = priceOf(p); return pr>0 ? (pr-num(p.cost))/pr : 0; };
  const staleDays = () => S.settings.staleDays ?? 30;
  // Від якої дати рахуємо застарілість: для товару із закупівлею — коли її востаннє вносили (накладна, таблиця, правка),
  // бо зміна націнки не робить стару закупівельну ціну свіжою; для ручної ціни без закупівлі — коли змінили ціну.
  const checkedAt = p => (num(p.cost)>0 ? p.costAt || p.priceAt : p.priceAt) || null;
  function priceState(p, now = Date.now()){
    if (priceOf(p) <= 0) return "none";
    const at = checkedAt(p), t = at ? Date.parse(at) : NaN;
    if (!isFinite(t)) return "stale";
    return (now-t)/864e5 > staleDays() ? "stale" : "ok";
  }
  // Точка беззбитковості. Продажів у базі ще немає, тож маржа — середня по товарах із закупівлею й ціною (без прикладів).
  // Діапазон beLo–beHi — якщо продаватимуться переважно товари з маржею як у верхньої чи нижньої чверті асортименту.
  function breakEven(products, expenses){
    const sum = fixed => expenses.filter(e=>(e.group==="fixed")===fixed).reduce((s,e)=>s+num(e.amount),0);
    const fixed = sum(true), variable = sum(false), costs = fixed + variable;
    const real = products.filter(p=>!p.example), ms = real.filter(p=>num(p.cost)>0 && priceOf(p)>0).map(marginOf).sort((a,b)=>a-b);
    const n = ms.length, avgM = n ? ms.reduce((s,m)=>s+m,0)/n : 0, q = f => n ? ms[Math.round(f*(n-1))] : 0;
    const lo = q(0.25), hi = q(0.75), per = m => m>0 ? costs/m : 0;
    return {fixed, variable, avgM, be:per(avgM), n, total:real.length, examples:products.length-real.length, lo, hi, beLo:per(hi), beHi:per(lo)};
  }
  const backupDue = (at, now = Date.now()) => { const t = at ? Date.parse(at) : NaN; return !isFinite(t) || (now-t)/864e5 >= 7; }; // нагадування про копію щотижня
  /* CALC-END */

  /* ---------- db writes ---------- */
  async function write(fn, ok){
    if (!db) { toast("Зміни зараз не зберігаються"); return; }
    try { await fn(); if (ok) toast(ok); }
    catch(e){
      if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await fn(); if(ok) toast(ok); return; }catch(_){} }
      toast(e && e.code==="invalid_argument" ? "Немає прав змінювати дані" : "Не вдалося зберегти, спробуйте ще раз");
    }
  }
  const gsSoon = col => { if (col==="products" && S.settings.gsId){ clearTimeout(S.gsSoonT); S.gsSoonT = setTimeout(()=>gsSync(), 2500); } };
  const upd = (col,id,data,ok) => write(()=>db.collection(col).doc(id).update(data), ok).then(r=>{ gsSoon(col); return r; });
  const add = (col,data,ok) => write(()=>db.collection(col).add(data), ok).then(r=>{ gsSoon(col); return r; });
  const del = (col,id,ok) => write(async()=>{
    // «надгробок» видаленого товару: лише за ним синхронізація очищує рядок у таблиці, а незнайомий ID не чіпає
    if (col==="products") await db.collection("deletedProducts").doc(id).set({at:today()});
    await db.collection(col).doc(id).delete();
  }, ok).then(r=>{ gsSoon(col); return r; });
  async function setDoc(path,data,ok){ await write(async()=>{ const ref=db.doc(path); const s=await ref.get(); s.exists ? await ref.update(data) : await ref.set(data); }, ok); }

  function saveTag(patch){
    const c = Object.assign(tagCfg(), patch); S.settings.tag = c; renderPreview();
    if (db) setDoc("settings/main", {tag:c});
  }
  function saveStores(n, ok){
    S.settings.storeNames = n; S.settings.stores = Math.max(1, n.length);
    if (tab==="tags") render();
    if (db) setDoc("settings/main", {storeNames:n, stores:Math.max(1, n.length)}, ok);
  }
  /* ---------- header + path ---------- */
  function renderPath(){
    $("#chainName").textContent = S.settings.chainName || "Мережа солодощів";
    const cur = S.project.stage || 1;
    const html = STAGES.map(st=>{
      const ts = S.tasks.filter(t=>t.stage===st.n), d = ts.filter(t=>t.status==="done").length;
      const cls = st.n<cur ? "done" : st.n===cur ? "now" : "";
      const meta = ts.length ? `${d} з ${ts.length} задач` : "ще не почато";
      return `<li class="stage ${cls}"><span class="candy" aria-hidden="true">${st.n<cur?"✓":st.n}</span>
        <div><div class="stage-name">${esc(st.name)}</div><div class="stage-meta">${st.n===cur?"зараз тут · ":""}${meta}</div></div></li>`;
    }).join("");
    $("#stages").innerHTML = html;
    const all = S.tasks.length, done = S.tasks.filter(t=>t.status==="done").length;
    $("#overall").textContent = all ? `Виконано ${done} з ${all} задач` : "";
    const nt = S.project.nextStep;
    $("#next").hidden = !nt; $("#nextText").textContent = nt || "";
    $("#foot").textContent = `Панель «Цукерня» · версія ${APP_VERSION}`;
    const u = S.project.updatedAt;
    $("#updated").textContent = u ? "Оновлено " + new Date(u).toLocaleDateString("uk-UA",{day:"numeric",month:"long"}) : "";
  }

  /* ---------- tabs ---------- */
  function render(){
    const a = document.activeElement;
    if (a && $("#main").contains(a) && (a.tagName==="INPUT" || a.tagName==="SELECT") && a.type!=="checkbox") { pending = true; return; }
    pending = false;
    renderPath();
    const m = $("#main");
    m.innerHTML = ({overview, tasks, ideas, products, tags, expenses})[tab]();
    if (tab==="tags") renderPreview();
  }
  $("#main").addEventListener("focusout", ()=>setTimeout(()=>{ if(pending) render(); },0));
  $("#tabs").addEventListener("click", e=>{
    const b = e.target.closest(".tab"); if(!b) return;
    tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===b));
    render();
  });

  /* ---------- totals ---------- */
  const totals = () => breakEven(S.products, S.expenses);

  function overview(){
    const t = totals();
    const doing = S.tasks.filter(x=>x.status==="doing");
    const fresh = S.ideas.filter(i=>!i.reaction);
    return `<section class="panel"><div class="stats">
      <div class="stat"><div class="v num">${S.products.length}</div><div class="l">товарів у базі</div></div>
      <div class="stat"><div class="v num">${t.n ? Math.round(t.avgM*100)+"%" : "—"}</div><div class="l">${t.n ? `середня маржа в ціні продажу, по ${t.n} з ${t.total} товарів` : "середня маржа: ще немає товарів із закупівельною ціною"}</div></div>
      <div class="stat"><div class="v num">${money0(t.fixed+t.variable)} грн</div><div class="l">витрати на місяць</div></div>
      <div class="stat"><div class="v num">${t.be?money0(t.be)+" грн":"—"}</div><div class="l">виручка на місяць, щоб вийти в нуль</div></div>
    </div></section>
    <section class="panel"><div class="row between gap-lg"><h2>Зараз у роботі</h2><button class="btn soft" data-go="tasks">Усі задачі</button></div>
      ${doing.length ? doing.map(taskRow).join("") : `<div class="empty">Нічого не в роботі. Відкрийте «Задачі» й позначте, за що беремося.</div>`}
    </section>
    ${backupPanel()}
    <section class="panel"><div class="row between gap-lg"><h2>Ідеї, що чекають вашої відповіді</h2><button class="btn soft" data-go="ideas">Усі ідеї</button></div>
      ${fresh.length ? `<div class="ideas">${fresh.slice(0,3).map(ideaCard).join("")}</div>` : `<div class="empty">На всі ідеї ви вже відповіли. Попросіть Claude в чаті запропонувати нові.</div>`}
    </section>`;
  }

  /* ---------- tasks ---------- */
  const ST_LABEL = {todo:"Не почато", doing:"В роботі", done:"Готово"};
  const ST_NEXT = {todo:"doing", doing:"done", done:"todo"};
  function taskRow(t){
    const s = t.status || "todo";
    return `<div class="task ${s}"><button class="chip ${s}" data-cycle="${t.id}" title="Натисніть, щоб змінити статус">${ST_LABEL[s]}</button>
      <span class="t">${esc(t.title)}</span><button class="x" data-del-task="${t.id}" aria-label="Видалити задачу">×</button></div>`;
  }
  function tasks(){
    const opts = STAGES.map(s=>`<option value="${s.n}">${s.n}. ${esc(s.name)}</option>`).join("");
    return `<section class="panel"><p class="muted gap-lg">Натискайте на статус задачі, щоб перемкнути його: не почато → в роботі → готово.</p>
      ${STAGES.map(st=>{
        const ts = S.tasks.filter(t=>t.stage===st.n);
        return `<div class="stage-block"><h3>${st.n}. ${esc(st.name)}</h3>${ts.length?ts.map(taskRow).join(""):`<p class="muted" style="padding:8px 0">Задач поки немає</p>`}</div>`;
      }).join("")}
    </section>
    <section class="panel"><h3 class="gap-lg">Додати задачу</h3>
      <div class="row"><input id="newTask" type="text" placeholder="Що треба зробити" style="flex:1;min-width:200px"><select id="newTaskStage">${opts}</select><button class="btn" data-act="addTask">Додати</button></div>
    </section>`;
  }

  /* ---------- ideas ---------- */
  function ideaCard(i){
    const r = i.reaction;
    return `<article class="idea ${r||""}"><h3>${esc(i.title)}</h3><p class="muted">${esc(i.text)}</p>
      <div class="acts">${r ? `<span class="muted">${r==="yes"?"Беремо в роботу":"Відкладено"}</span><button class="btn soft" data-react="${i.id}" data-v="">Змінити</button>`
        : `<button class="btn rasp" data-react="${i.id}" data-v="yes">Так, цікаво</button><button class="btn soft" data-react="${i.id}" data-v="no">Не зараз</button>`}</div></article>`;
  }
  function ideas(){
    return `<section class="panel"><p class="muted gap-lg">Claude пропонує ідеї для мережі. Відповідайте «Так» або «Не зараз» — у чаті я побачу вашу відповідь і розпишу план для того, що вам сподобалось.</p>
      ${S.ideas.length?`<div class="ideas">${S.ideas.map(ideaCard).join("")}</div>`:`<div class="empty">Ідей поки немає</div>`}</section>
    <section class="panel"><h3 class="gap-lg">Своя ідея</h3><div class="row"><input id="newIdea" type="text" placeholder="Коротко опишіть ідею" style="flex:1;min-width:200px"><button class="btn" data-act="addIdea">Записати</button></div></section>`;
  }

  /* ---------- products ---------- */
  const cats = () => [...new Set(S.products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"uk"));
  const packOpts = cur => { const l = allPacks(); if (cur && !l.includes(cur)) l.push(cur); return `<option value="">${NOPACK}</option>` + l.map(x=>`<option ${x===cur?"selected":""}>${esc(x)}</option>`).join(""); };
  function productList(list){
    if (!list.length) return `<div class="empty">${S.products.length ? `Нічого не знайдено за цими фільтрами. <button class="btn soft" data-act="fReset">Скинути фільтри</button>` : "Товарів ще немає. Надішліть накладну в чат або додайте товар нижче."}</div>`;
    const perType = new Map(); list.forEach(p=>perType.set(typeOf(p), (perType.get(typeOf(p))||0)+1));
    return `<div class="scroll"><table><thead><tr><th>Назва</th><th>Тип</th><th>Пакування</th><th>Об’єм / вага</th><th>Од.</th><th class="r">Закупівля, грн</th><th class="r">Націнка, %</th><th class="r">Ціна продажу, грн</th><th class="r">Заробіток з одиниці</th><th>Ціна оновлена</th><th></th></tr></thead><tbody>
      ${sortByType(list).map((p,i,arr)=>{const pr=priceOf(p), st=priceState(p);
        const head = (i===0||typeOf(arr[i-1])!==typeOf(p)) ? `<tr class="grp"><th colspan="11">${esc(typeOf(p))} · ${perType.get(typeOf(p))}</th></tr>` : "";
        const sub = (i===0||typeOf(arr[i-1])!==typeOf(p)||catKey(arr[i-1])!==catKey(p)) ? `<tr class="sgrp"><td colspan="11">${esc(catKey(p))}</td></tr>` : "";
        const when = p.priceAt ? new Date(p.priceAt).toLocaleDateString("uk-UA",{day:"numeric",month:"short"}) : "—";
        const chk = checkedAt(p), chkTxt = chk ? new Date(chk).toLocaleDateString("uk-UA") : "невідомо коли";
        const stTitle = num(p.cost)>0 ? `Закупівельну ціну востаннє вносили ${chkTxt}` : `Ціну востаннє змінювали ${chkTxt}`;
        const stCell = st==="none" ? `<span class="badge bad">немає ціни</span>` : st==="stale" ? `<span class="badge" title="${esc(stTitle)}. Застаріла — якщо понад ${staleDays()} днів.">застаріла</span> ${when}` : `<span class="muted" title="${esc(stTitle)}">${when}</span>`;
        return head+sub+`<tr>
        <td>${esc(p.name)}${p.example?'<span class="badge">приклад</span>':""}</td>
        <td><select data-ptype data-id="${p.id}" aria-label="Тип товару">${typeOpts(typeOf(p))}</select></td>
        <td><select data-ppack data-id="${p.id}" aria-label="Пакування">${packOpts(p.pack||"")}</select></td>
        <td><input type="text" class="w-size" value="${esc(p.size||"")}" data-psize data-id="${p.id}" aria-label="Розмір" placeholder="—"></td>
        <td><select data-punit data-id="${p.id}" aria-label="Одиниця продажу">${unitOpts(p.unit||"шт")}</select></td>
        <td class="r"><input type="number" step="0.01" min="0" value="${num(p.cost)}" data-pf="cost" data-id="${p.id}" aria-label="Закупівля"></td>
        <td class="r"><input type="number" step="1" value="${p.markup??defMarkup()}" data-pf="markup" data-id="${p.id}" aria-label="Націнка"></td>
        <td class="r"><input type="number" step="0.01" min="0" value="${pr}" data-pf="price" data-id="${p.id}" aria-label="Ціна продажу" title="${p.manualPrice?"Ціну задано вручну":"Ціна рахується з націнки"}"></td>

  /* ---------- PDF (без бібліотек: малюємо аркуші на canvas і пакуємо в PDF) ---------- */

  function fscale(c){ const f=+c.font||1; return {n:f, g:+(1+(f-1)*0.35).toFixed(3), q:+(1+(f-1)*0.6).toFixed(3)}; }

      if (c.border==="dash") ctx.setLineDash([PX_MM*1.2, PX_MM*0.8]);
      ctx.lineWidth = 2; ctx.strokeStyle = c.border==="solid" ? "#555" : "#999"; ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
    } else { ctx.lineWidth = 1; ctx.strokeStyle = "#eee"; ctx.strokeRect(x, y, w, h); }

  function pdfFromJpegs(pages){
    const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
    const put = d => { const u = typeof d==="string" ? enc.encode(d) : d; parts.push(u); len += u.length; };
    const PW = 595.28, PH = 841.89, n = pages.length;
    put("%PDF-1.4\n");
    offs[1] = len; put("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    offs[2] = len; put(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] >>\nendobj\n`);
    pages.forEach((pg,i)=>{
      const pid = 3+3*i, cid = pid+1, iid = pid+2, content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
      offs[pid] = len; put(`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
      offs[cid] = len; put(`${cid} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
      offs[iid] = len; put(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);
      put(pg.bytes); put("\nendstream\nendobj\n");
    });
    const total = 3+3*n, xref = len;
    put(`xref\n0 ${total}\n0000000000 65535 f \n` + offs.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
    put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, {type:"application/pdf"});
  }

  function parseCsv(text){

      if (m.markup==="") m.markup = n2(def);
      let patch = null;
      if (!same(m, a) || p.hidden){ patch = toPatch(m, p); if (p.hidden) patch.hidden = false; plan.changed++; }
      if (!b || !same(m, b)){ patch = patch || {}; patch.gsBase = m; }
      if (patch) plan.dbUpdates.push({id:p.id, patch});
      const after = Object.assign({}, p, patch || {});
      const out = rowOut(m, p.id, env.priceOf(after), after.priceAt || "");
      if (!same(m, s) || !calcSame(r, out)){ plan.rowWrites.push({row:i+1, values:out}); if (!same(m, s)) plan.pushed++; }
    };
    rows.forEach((r, i) => {
      if (i===0 || !r || !cell(r,"name")) return;
      plan.n++;
      const id = cell(r,"id").replace(/^'/,"");
      if (id && byId.has(id) && !claimed.has(id)){ claimed.add(id); handle(r, i, byId.get(id)); return; }
      if (id && !byId.has(id) && env.deleted && env.deleted.has(id)){ plan.clears.push(i+1); plan.n--; return; } // товар видалили в застосунку
      pending.push([r, i]); // без ID або з незнайомим ID (рядок зі старої копії, зіпсований ID): шукаємо за назвою або додаємо як новий
    });
    const byName = new Map(); all.forEach(p=>{ if (!claimed.has(p.id) && !p.hidden){ const k = env.norm(p.name); if (!byName.has(k)) byName.set(k, p); } });
    for (const [r, i] of pending){
      const k = env.norm(cell(r,"name")), p = byName.get(k);
      if (p){ byName.delete(k); claimed.add(p.id); handle(r, i, p); continue; }
      const s = fromSheet(r); if (s.markup==="") s.markup = n2(def);
      const id = env.newId(), data = toPatch(s, null);
      data.gsBase = s; if (!(+s.cost>0 || +s.price>0)) delete data.priceAt;
      plan.dbAdds.push({id, data}); plan.added++;
      plan.rowWrites.push({row:i+1, values:rowOut(s, id, env.priceOf(data), data.priceAt || "")});
    }
    for (const p of all){
      if (claimed.has(p.id) || p.hidden) continue;
      if (p.gsBase){ plan.dbUpdates.push({id:p.id, patch:{hidden:true}}); continue; } // рядок видалили в таблиці
      const a = fromApp(p);
      plan.appends.push(rowOut(a, p.id, env.priceOf(p), p.priceAt || ""));
      plan.dbUpdates.push({id:p.id, patch:{gsBase:a}});
    }
    return plan;
  }
  /* SYNC-ENGINE-END */

  /* SYNC-RUNNER-START */
  const SHEETS = "Google Sheets";
  const sheets = (tool, input) => mcp.callTool(SHEETS, tool, input, {cache:false}).then(pj);
  function sheetsErr(e){
    const c = e && e.code;
    if (c==="server_not_connected") return "Google Sheets не підключений до вашого акаунта Claude. Підключіть його в налаштуваннях конекторів.";
    if (c==="needs_reauth") return "Потрібно заново підключити Google Sheets у налаштуваннях Claude.";
    if (c==="consent_required" || c==="approval_required") return "Дозвольте сторінці працювати з Google Sheets, коли з’явиться запит.";
    if (c==="rate_limited") return "Забагато запитів до Google. Спробую ще раз за хвилину.";
    if (c==="tool_error") return "Google Sheets відповів помилкою (можливо, немає доступу до таблиці).";
    return "Не вдалося зв’язатися з Google Sheets. Спробую ще раз за хвилину.";
  }
  const clean = o => JSON.parse(JSON.stringify(o));
  // Замок у базі: синхронізує лише одна вкладка чи пристрій водночас, інакше новий рядок таблиці стає двома товарами.
  const SYNC_HOLDER = Math.random().toString(36).slice(2) + Date.now().toString(36), SYNC_TTL = 60000;
  async function syncLease(ttlMs){
    const ref = db.doc("sync/lock");
    if (typeof ref.acquire !== "function") return {acquired:true}; // середовище без замків — як раніше
    try{ return await ref.acquire({holder:SYNC_HOLDER, ttlMs}); }
    catch(e){
      if (e && (e.code==="capability_removed" || e.code==="capability_disabled")) return {acquired:true};
      if (e && e.code==="invalid_argument") throw {sheetErr:"Немає прав змінювати дані, тому синхронізацію з таблицею тут не запускаю."};
      throw {sheetErr:"Не вдалося перевірити, чи не синхронізує зараз інший пристрій. Спробую ще раз за хвилину."};
    }
  }
  async function gsSync(){
    const id = S.settings.gsId; if (!id || !mcp || !db) return;
    const y = S.sync || (S.sync = {});
    if (y.busy){ y.again = true; return; }
    y.busy = true; y.error = null; y.waiting = false; updateSyncUi();
    let held = false;
    try{
      const lease = await syncLease(SYNC_TTL);
      if (!lease.acquired){ // синхронізує інша вкладка чи пристрій — повторимо, щойно звільнить
        y.waiting = true; y.again = false;
        const wait = Math.min(65000, Math.max(2000, (Date.parse(lease.expiresAt) || 0) - Date.now() + 500));
        clearTimeout(S.syncRetryT); S.syncRetryT = setTimeout(gsSync, wait + Math.random()*1500);
        return;
      }
      held = true; let leaseAt = Date.now();
      const keep = async () => { // подовжуємо замок на довгих синхронізаціях
        if (Date.now() - leaseAt < SYNC_TTL/3) return;
        if (!(await syncLease(SYNC_TTL)).acquired) throw {sheetErr:"Синхронізацію перехопив інший пристрій. Спробую ще раз за хвилину."};
        leaseAt = Date.now();
      };
      const d = await sheets("get_values", {spreadsheetId:id, range:"A:Z"});
      // Товари читаємо з бази заново, а не з S.allProducts: знімок може ще не мати товарів, які щойно додав інший пристрій
      const all = (await db.collection("products").get()).docs.map(x=>({id:x.id, ...x.data()}));
      const deleted = new Set((await db.collection("deletedProducts").get()).docs.map(x=>x.id));
      const plan = planSync(d && Array.isArray(d.values) ? d.values : [], all, {
        defMarkup:defMarkup(), priceOf, norm, parseNum, unitNorm, packNorm, today:today(), deleted,
        newId:()=>db.collection("products").doc().id || ("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,7))});
      if (plan.error) throw {sheetErr:plan.error};
      const L = plan.last;
      // 1) нові товари з таблиці — у застосунок (щоб їхні ID вже існували)
      for (const a of plan.dbAdds){ await keep(); await db.collection("products").doc(a.id).set(clean(a.data)); }
      // 2) записи в таблицю
      await keep();
      if (plan.header) await sheets("update_values", {spreadsheetId:id, range:`A1:${L}1`, values:[plan.header]});
      if (plan.rowWrites.length){ // один запит на всі змінені рядки: незмінені рядки — null (Google їх пропускає)
        const lo = Math.min(...plan.rowWrites.map(w=>w.row)), hi = Math.max(...plan.rowWrites.map(w=>w.row));
        const block = Array.from({length:hi-lo+1}, ()=>new Array(plan.width).fill(null));
        plan.rowWrites.forEach(w=>{ block[w.row-lo] = w.values; });
        await sheets("update_values", {spreadsheetId:id, range:`A${lo}:${L}${hi}`, values:block});
      }
      if (plan.appends.length){ // дописуємо під останнім заповненим рядком (append_values Google може «вставити» посеред таблиці)
        const at = plan.lastRow + 1;
        await sheets("update_values", {spreadsheetId:id, range:`A${at}:${L}${at+plan.appends.length-1}`, values:plan.appends});
      }
      if (plan.clears.length) await sheets("batch_clear_values", {spreadsheetId:id, ranges:plan.clears.map(r=>`A${r}:${L}${r}`)});
      // 3) зміни з таблиці — у застосунок
      for (const u of plan.dbUpdates){ await keep(); await db.collection("products").doc(u.id).update(clean(u.patch)); }
      Object.assign(y, {at:Date.now(), n:plan.n, added:plan.added, upd:plan.changed, pushed:plan.pushed + plan.appends.length});
    }catch(e){ y.error = (e && e.sheetErr) ? e.sheetErr : /quota|rate/i.test(String(e && (e.message||""))) ? "Google тимчасово обмежив кількість запитів. Спробую ще раз за хвилину." : sheetsErr(e); }
    finally{
      if (held) await syncLease(1000).catch(()=>{}); // звільняємо замок: окремої команди немає, тож коротшаємо строк до 1 с
      y.busy = false; updateSyncUi();
      if (y.again){ y.again = false; setTimeout(gsSync, 3000); }
    }
  }
  /* SYNC-RUNNER-END */
  function syncSetup(){
    clearInterval(S.syncT);
    if (mcp && db && S.settings.gsId){
      if (S.syncKey !== S.settings.gsId){ S.syncKey = S.settings.gsId; gsSync(); }
      S.syncT = setInterval(()=>{ if (!document.hidden) gsSync(); }, 60000);
    } else S.syncKey = null;
  }
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && S.syncKey) gsSync(); });

  function expRow(e){
    return `<div class="exp"><span class="n">${esc(e.name)}</span><input type="number" min="0" step="100" value="${num(e.amount)}" data-exp="${e.id}" aria-label="${esc(e.name)}, грн на місяць"><span class="muted">грн</span><button class="x" data-del-exp="${e.id}" aria-label="Видалити статтю">×</button></div>`;
  }
  function beBlock(t){
    const pct = m => Math.round(m*100) + "%", stores = S.settings.stores || 1;
    if (!t.be){
      if (t.fixed + t.variable <= 0) return `<div>Точка беззбитковості з’явиться, коли ви впишете суми витрат.</div>`;
      if (!t.n) return `<div>Точка беззбитковості з’явиться, коли в товарів будуть закупівельні ціни${t.examples ? " (товари-приклади не враховуються)" : ""}.</div>`;
      return `<div>Середня маржа не більша за нуль — перевірте ціни продажу: з такими цінами витрати не покриваються.</div>`;
    }
    const range = t.n >= 4 && t.beHi - t.beLo >= t.be*0.02
      ? `<div class="muted">Залежно від того, що продаватиметься більше, — від ${money0(t.beLo)} до ${money0(t.beHi)} грн на місяць (маржа ${pct(t.hi)} або ${pct(t.lo)}).</div>` : "";
    const basis = (t.n < t.total ? ` Пораховано по ${t.n} з ${t.total} товарів — у решти немає закупівельної ціни.` : "") + (t.examples ? " Товари-приклади не враховуються." : "");
    return `<div class="muted">Щоб покрити всі витрати, мережі треба продати на</div>
        <div class="big num">${money0(t.be)} грн на місяць</div>
        <div class="muted">≈ ${money0(t.be/30)} грн на день${stores>1?` · ≈ ${money0(t.be/30/stores)} грн на день з кожного магазину`:""}. Розрахунок за середньою маржею ${pct(t.avgM)}.${basis}</div>${range}`;
  }
  function expenses(){
    const t = totals(), fx = S.expenses.filter(e=>e.group==="fixed"), vr = S.expenses.filter(e=>e.group!=="fixed");

      <div class="total"><span>Разом на місяць</span><span class="num">${money0(sum)} грн</span></div></div>`;

    if (el.id==="tcCustom"){ saveTag({custom:el.value.trim().slice(0,40)}); return; }
    if (el.id==="chainIn"){ const v = el.value.trim(); S.settings.chainName = v; renderPreview(); setDoc("settings/main",{chainName:v||"Мережа солодощів"},"Назву мережі збережено"); return; }
    if (el.dataset.store!==undefined){ const n = storeNames().slice(); n[+el.dataset.store] = el.value.trim(); saveStores(n, "Назву магазину збережено"); return; }
    if (el.id==="rounding"){ setDoc("settings/main",{rounding:num(el.value)},"Округлення змінено"); }
    if (el.id==="stores"){ setDoc("settings/main",{stores:Math.max(1,Math.round(num(el.value)))}); }
  });
  document.addEventListener("input", e=>{
    if (e.target.id==="tcCustom"){ S.settings.tag = Object.assign(tagCfg(), {custom:e.target.value}); renderPreview(); return; }
    if (e.target.id==="q"){ curF().q = e.target.value; clearTimeout(refreshFilters._t); refreshFilters._t = setTimeout(refreshFilters, 180); }
  });
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape" && S.openF){ const k = S.openF; S.openF = null; refreshFilters({t:k}); return; }
    if (e.key!=="Enter") return;
    if (e.target.dataset && e.target.dataset.qty){ e.target.blur(); return; }
    const map = {qtyAll:"qtyAll", newTask:"addTask", newIdea:"addIdea", npName:"addProd", gsQ:"gsSearch"};
    if (map[e.target.id]) document.querySelector(`[data-act="${map[e.target.id]}"]`).click();
  });

  /* ---------- data ---------- */
  render();
  const noDbTimer = setTimeout(()=>{ if(!db) $("#noDb").hidden=false; }, 4000);
  window.claude?.use?.("downloads").then(d=>{ downloads=d; if(tab==="tags") render(); }).catch(()=>{});
  window.claude?.use?.("mcp").then(m=>{ mcp=m; if(tab==="tags"||tab==="products") render(); syncSetup(); }).catch(()=>{});
  (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)).then(d=>{
    if(!d){ $("#noDb").hidden=false; clearTimeout(noDbTimer); return; }
    db = d; clearTimeout(noDbTimer);
    const byOrder = (a,b)=>(a.order??0)-(b.order??0);
    const sub = (col, key, sort) => db.collection(col).onSnapshot(s=>{
      S[key] = s.docs.map(x=>({id:x.id, ...x.data()})).sort(sort); render();
    }, ()=>{});
    sub("tasks","tasks",(a,b)=>(a.stage-b.stage)||byOrder(a,b));
    sub("ideas","ideas",byOrder);
    db.collection("products").onSnapshot(s=>{
      S.allProducts = s.docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"uk"));
      S.products = S.allProducts.filter(p=>!p.hidden); render();
    }, ()=>{});
    sub("expenses","expenses",byOrder);
    db.doc("settings/main").onSnapshot(s=>{ S.settings = s.exists ? s.data() : {}; render(); syncSetup(); }, ()=>{});
    db.doc("project/state").onSnapshot(s=>{ S.project = s.exists ? s.data() : {}; render(); }, ()=>{});
  }).catch(()=>{ $("#noDb").hidden=false; });
})();
</script>
</body>
</html>
