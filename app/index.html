<title>Цукерня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600;700&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Вітрина власника: шапка з брендом і станом таблиці, п'ять розділів (знизу на телефоні), робочі картки на фісташковому тлі.
   Кольори — з кондитерської: гіркий шоколад (текст), малина (дія), карамель (увага), фісташка (добре). */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --surface-2:#F4F7F4; --ink:#2A1A20; --ink-2:#6C5A61; --line:#DCE4DD; --line-2:#C7D3CA;
  --accent:#C2185B; --accent-ink:#FFFFFF; --accent-soft:#FBE4EC;
  --warn:#9A5B00; --warn-soft:#FCEFD8; --good:#23794F; --good-soft:#DDF1E5; --bad:#B42318; --bad-soft:#FDE6E3;
  --tag-paper:#FFFFFF; --tag-ink:#1C1C1C; --hero:#2A1A20; --hero-ink:#F5EDEF; --shadow:0 1px 2px rgba(42,26,32,.06),0 8px 24px rgba(42,26,32,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-s:10px; --gut:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171113; --surface:#22191C; --surface-2:#2A2024; --ink:#F5EDEF; --ink-2:#B8A8AE; --line:#3A2D32; --line-2:#4A3A40;
    --accent:#FF6E9C; --accent-ink:#2A0D18; --accent-soft:#45202F; --hero:#3B1D2A; --hero-ink:#F5EDEF;
    --warn:#F3B65B; --warn-soft:#3A2A16; --good:#79D4A6; --good-soft:#163024; --bad:#FF8A7D; --bad-soft:#3E1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171113; --surface:#22191C; --surface-2:#2A2024; --ink:#F5EDEF; --ink-2:#B8A8AE; --line:#3A2D32; --line-2:#4A3A40;
  --accent:#FF6E9C; --accent-ink:#2A0D18; --accent-soft:#45202F; --hero:#3B1D2A; --hero-ink:#F5EDEF;
  --warn:#F3B65B; --warn-soft:#3A2A16; --good:#79D4A6; --good-soft:#163024; --bad:#FF8A7D; --bad-soft:#3E1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.45rem,3.2vw,1.95rem);letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.12rem;letter-spacing:-.005em}
h3{font-size:1rem;font-weight:600}
h4{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- оболонка ---------- */
.app{max-width:1180px;margin:0 auto;padding-inline:var(--gut);padding-block:0 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:18px;padding:14px 0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.bar>.brand+#envPill{margin-left:-6px}
.bar>.tabs{margin-left:auto}
.brand-mark{width:38px;height:38px;flex:none;color:var(--accent)}
.brand-t{min-width:0}
.brand-t b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.1}
.brand-t span{display:block;font-size:.8rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{position:relative;border:0;background:transparent;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .dot{position:absolute;top:6px;left:26px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.tab[aria-selected="true"] .dot{box-shadow:0 0 0 2px var(--ink)}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;color:var(--ink-2);max-width:250px;white-space:nowrap}
.sync span{overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-2)}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn);animation:pulse 1s ease-in-out infinite} .sync.err i{background:var(--bad)}
.sync.err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@keyframes pulse{50%{opacity:.35}}
main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.foot{margin-top:28px;text-align:center;font-size:.8rem;color:var(--ink-2)}
@media (max-width:860px){
  .bar{gap:10px;padding:10px 0}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;border-radius:0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .tab{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:.72rem;border-radius:12px;max-width:110px}
  .tab svg{width:22px;height:22px}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .tab .dot{left:calc(50% + 6px);top:4px}
  .tab[aria-selected="true"] .dot{box-shadow:0 0 0 2px var(--accent-soft)}
  .app{padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
  .sync{max-width:46vw;margin-left:auto}
}
@media (max-width:420px){ .brand-t span{display:none} .sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .sync{padding:9px} }

/* ---------- картки, кнопки, поля ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{font-size:.88rem;color:var(--ink-2)}
.screen-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px 2px}
.screen-h p{color:var(--ink-2);margin-top:4px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-tags{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
@media (max-width:960px){.g-2,.g-tags{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid transparent;border-radius:var(--r-s);padding:8px 14px;font-weight:500;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:8px;line-height:1.35;text-decoration:none;white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--ink-2);padding-inline:8px}
.btn.quiet:hover{color:var(--ink)}
.btn.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
input[type=text],input[type=search],input[type=number],input:not([type]),select{height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:0 10px;min-width:0;color:var(--ink)}
input[type=number]{width:92px;text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
label.inl{display:inline-flex;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--ink-2)}
.x{border:0;background:transparent;color:var(--ink-2);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;flex:none}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.x svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem}
.note.warn{background:var(--warn-soft);border-color:transparent} .note.bad{background:var(--bad-soft);border-color:transparent} .note.good{background:var(--good-soft);border-color:transparent}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:600}
.toast button[hidden]{display:none}
.toast:not(.has-act){padding-right:16px}
@media (max-width:860px){.toast{bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px))}}
#noDb{margin-top:8px}

/* ---------- Сьогодні ---------- */
.today-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding:8px 2px 4px}
.today-h .date{font-size:.84rem;color:var(--ink-2)}
.today-h .date::first-letter{text-transform:uppercase}
.stagechip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-size:.88rem;color:var(--ink)}
.stagechip b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem}
.nextstep{position:relative;background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:20px 22px 20px 56px;overflow:hidden}
.nextstep::before{content:"";position:absolute;left:20px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.nextstep::after{content:"";position:absolute;left:44px;top:14px;bottom:14px;border-left:2px dashed color-mix(in srgb,var(--hero-ink) 30%,transparent)}
.nextstep{padding-left:64px}
.nextstep h4{color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.nextstep p{font-size:1.08rem;font-weight:500;margin-top:6px;max-width:65ch}
.att{display:flex;flex-direction:column}
.att-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.att-i:first-child{border-top:0;padding-top:2px}
.att-n{grid-row:span 2;min-width:44px;height:44px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.05rem;background:var(--surface-2);color:var(--ink)}
.att-i.bad .att-n{background:var(--bad-soft);color:var(--bad)} .att-i.warn .att-n{background:var(--warn-soft);color:var(--warn)} .att-i.good .att-n{background:var(--good-soft);color:var(--good)}
.att-n svg{width:20px;height:20px}
.att-t{font-weight:600;min-width:0}
.att-d{grid-column:2;font-size:.86rem;color:var(--ink-2);min-width:0}
.att-a{grid-row:1/span 2;grid-column:3}
@media (max-width:520px){.att-a{grid-row:auto;grid-column:2;justify-self:start;margin-top:4px}}
.allgood{display:flex;gap:14px;align-items:center;padding:6px 0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:.82rem;color:var(--ink-2)}
.kpi .v{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.kpi .v small{font-size:.9rem;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .s{font-size:.8rem;color:var(--ink-2)}
.kpi.wide{grid-column:1/-1}
.meter{position:relative;height:8px;border-radius:999px;background:var(--surface-2);margin-top:6px;overflow:visible}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--good)}
.meter.warn>i{background:var(--warn)}
.meter>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .t{flex:1;min-width:0}
.task.done .t{color:var(--ink-2);text-decoration:line-through}
.chip{border:1px solid transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;min-width:86px;text-align:center}
.chip.todo{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)} .chip.doing{background:var(--warn-soft);color:var(--warn)} .chip.done{background:var(--good-soft);color:var(--good)}

/* ---------- План: етапи-цукерки ---------- */
.stages{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.stages::before{content:"";position:absolute;left:12.5%;right:12.5%;top:21px;height:3px;background:repeating-linear-gradient(90deg,var(--line-2) 0 8px,transparent 8px 14px)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px;gap:10px}
.candy{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:3px solid var(--line-2);color:var(--ink-2);z-index:1}
.candy::before,.candy::after{content:"";position:absolute;top:50%;border-top:10px solid transparent;border-bottom:10px solid transparent;transform:translateY(-50%)}
.candy::before{left:-14px;border-right:13px solid var(--line-2)} .candy::after{right:-14px;border-left:13px solid var(--line-2)}
.stage.done .candy{background:var(--good);border-color:var(--good);color:var(--surface)}
.stage.done .candy::before{border-right-color:var(--good)} .stage.done .candy::after{border-left-color:var(--good)}
.stage.now .candy{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.15)}
.stage.now .candy::before{border-right-color:var(--accent)} .stage.now .candy::after{border-left-color:var(--accent)}
.stage-name{font-weight:600;font-size:.95rem}
.stage.now .stage-name{color:var(--accent)}
.stage-meta{font-size:.8rem;color:var(--ink-2)}
@media (max-width:640px){
  .stages{grid-template-columns:minmax(0,1fr);gap:16px}
  .stages::before{left:20px;right:auto;top:8px;bottom:8px;width:3px;height:auto;background:repeating-linear-gradient(180deg,var(--line-2) 0 8px,transparent 8px 14px)}
  .stage{flex-direction:row;text-align:left;gap:18px;padding:0}
}
.stage-block+.stage-block{margin-top:18px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.idea{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.idea.yes{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:var(--good-soft)}
.idea.no{opacity:.6}
.idea .acts{display:flex;gap:8px;margin-top:auto;align-items:center;flex-wrap:wrap}

/* ---------- Товари ---------- */
.sheetbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.sheetbar .st{flex:1;min-width:220px}
.sheetbar .st b{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.views{display:flex;gap:6px;flex-wrap:wrap}
.view{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.view b{font-weight:600;color:var(--ink)}
.view[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.view[aria-pressed="true"] b{color:var(--bg)}
.view.warn b{color:var(--warn)} .view.bad b{color:var(--bad)}
.view[aria-pressed="true"].warn b,.view[aria-pressed="true"].bad b{color:var(--bg)}
.plist{display:flex;flex-direction:column}
.phead,.prow{display:grid;grid-template-columns:minmax(0,1fr) 96px 80px 96px 150px 128px 36px;gap:10px;align-items:center}
.phead{font-size:.76rem;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;padding:0 0 8px;border-bottom:1px solid var(--line-2);position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--surface);z-index:5}
.phead .r{text-align:right}
.phead span:nth-child(5){padding-left:8px}
.prow{padding:9px 0;border-bottom:1px solid var(--line)}
.prow input[type=number]{width:100%}
.pname{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.pname button{border:0;background:transparent;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.3;max-width:100%}
.pname button:hover{color:var(--accent)}
.pmeta{font-size:.8rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 8px}
.pmargin{display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.pmargin .meter{margin-top:0;height:6px}
.pstate{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.gh{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px}
.gh h3{font-family:var(--f-display);font-size:.95rem;font-weight:600}
.ch{font-size:.8rem;font-weight:600;color:var(--accent);padding:10px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.pedit{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--surface-2);border-radius:12px;padding:14px;margin:4px 0 6px}
.pedit .field input,.pedit .field select{width:100%}
.pedit .field:first-child{grid-column:span 2}
@media (max-width:420px){.pedit .field:first-child{grid-column:auto}}
.pedit .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.ex{font-size:.72rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 7px}
@media (max-width:760px){
  .phead{display:none}
  .prow{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"n n n" "c m p" "g g s";gap:8px 10px;padding:14px 0}

(function(){

  const allTypes = () => [...TYPES, ...new Set(S.products.map(typeOf).filter(t=>t!==NOTYPE && !TYPES.includes(t)))];
  const UK = new Intl.Collator("uk");
  const typeRanker = () => { const m = new Map(allTypes().map((t,i)=>[t,i])); return t => m.has(t) ? m.get(t) : 999; }; // порядок груп рахуємо раз на сортування

  const typeOpts = cur => { const l = allTypes(); if (cur && cur!==NOTYPE && !l.includes(cur)) l.push(cur); return (cur===NOTYPE?`<option value="" selected>${NOTYPE}</option>`:"") + l.map(t=>`<option ${t===cur?"selected":""}>${esc(t)}</option>`).join(""); };

  const money0 = v => Math.round(v).toLocaleString("uk-UA");
  const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };

  const UNITS = [["шт","шт — штука"],["кг","кг — кілограм (ваговий)"],["100 г","100 г"],["уп","уп — упаковка"],["пач","пач — пачка"],["кор","кор — коробка"],["л","л — літр (розлив)"],["порц","порц — порція"],["набір","набір"]];

  const PACKS = ["Банка","ПЕТ","Скло","Стакан","Коробка","Пакет","Упаковка","Ваговий","Штучно"];

    {k:"types", label:"Група", val:typeOf},

    {k:"price", label:"Ціна", val:priceState}];
  const curF = () => S.F[tab==="tags" ? "tags" : "prod"];
  const isActive = f => !!f.q.trim() || (f.view||"all")!=="all" || FACETS.some(fc=>f[fc.k].size>0);
  function matches(p, f, skip){
    const q = f.q.trim().toLowerCase();
    if (q && !String(p.name).toLowerCase().includes(q)) return false;
    if (f.view && f.view!=="all" && !viewOf(f).f(p)) return false;
    for (const fc of FACETS){ if (fc.k===skip) continue; const st = f[fc.k]; if (st.size && !st.has(fc.val(p))) return false; }
    return true;
  }
  const filtered = f => S.products.filter(p=>matches(p,f,null));
  function sizeRank(v){
    if (v===NOSIZE) return 1e9;
    const ci = CUPS.indexOf(String(v).toUpperCase()); if (ci>=0) return 5e4+ci;
    const m = String(v).match(/^\s*(\d+(?:[.,]\d+)?)\s*(мл|л|кг|г)/i);
    if (m){ let x = parseFloat(m[1].replace(",",".")); const u = m[2].toLowerCase(); if (u==="мл"||u==="г") x/=1000; return ((u==="л"||u==="мл") ? 0 : 1e4) + x; }
    return 1e5;
  }
  function facetEntries(fc, f){
    const m = new Map();
    if (fc.k==="price") ["ok","stale","none"].forEach(k=>m.set(k,0));
    S.products.forEach(p=>{ const v = fc.val(p); if (!m.has(v)) m.set(v,0); });
    S.products.filter(p=>matches(p,f,fc.k)).forEach(p=>{ const v = fc.val(p); m.set(v,(m.get(v)||0)+1); });
    const last = {types:NOTYPE, cats:NOCAT, packs:NOPACK, sizes:NOSIZE}[fc.k];
    const pl = allPacks(), po = x => pl.indexOf(x)<0 ? 99 : pl.indexOf(x), PO = ["ok","stale","none"], rank = typeRanker();
    const ord = {
      types:(a,b)=>rank(a)-rank(b),
      cats:(a,b)=>a.localeCompare(b,"uk"),
      packs:(a,b)=>po(a)-po(b),
      sizes:(a,b)=>sizeRank(a)-sizeRank(b) || a.localeCompare(b,"uk"),
      price:(a,b)=>PO.indexOf(a)-PO.indexOf(b)}[fc.k];
    return [...m.entries()].sort((a,b)=> (a[0]===last)-(b[0]===last) || ord(a[0],b[0]));
  }
  function ddLabel(fc, f){
    const st = f[fc.k]; if (!st.size) return fc.label;
    const arr = [...st];
    return `${fc.label}: ${arr.length===1 ? (fc.k==="price" ? PRICE_LABEL[arr[0]] : arr[0]) : arr.length+" обрано"}`;
  }
  function facetRow(fc, f){

    const extra = fc.k==="price" ? `<label class="dd-stale" title="Для товарів із закупівлею — від дня, коли її востаннє вносили (накладна, таблиця чи правка); зміна націнки цю дату не оновлює.">Застаріла — старіша за <select id="staleDays" aria-label="Через скільки днів ціна вважається застарілою">${[7,14,30,60,90].map(d=>`<option value="${d}" ${d===staleDays()?"selected":""}>${d} днів</option>`).join("")}</select></label>` : "";
    return `<div class="dd${open?" open":""}${st.size?" active":""}"><button type="button" class="dd-btn" data-ddtoggle="${fc.k}" aria-expanded="${open}" aria-haspopup="true"><span class="dd-l">${esc(ddLabel(fc,f))}</span><span class="dd-caret" aria-hidden="true">▾</span></button>${open ? `<div class="dd-pop" role="group" aria-label="${fc.label}">${st.size?`<button type="button" class="dd-clear" data-fclear="${fc.k}">Очистити вибір</button>`:""}<div class="dd-list">${opts}</div>${extra}</div>` : ""}</div>`;
  }
  const facetsHtml = f => FACETS.map(fc=>facetRow(fc,f)).join("");
  const countText = f => `${filtered(f).length} з ${S.products.length}`;
  function filterBar(f){
    return `<div class="fbar"><span class="search">${ICON.search}<input id="q" type="search" placeholder="Пошук за назвою" value="${esc(f.q)}" aria-label="Пошук за назвою"></span><div id="facets">${facetsHtml(f)}</div><span class="fcount num" id="fcount" title="Показано товарів з усіх">${countText(f)}</span><button type="button" class="btn quiet" id="fResetBtn" data-act="fReset" ${isActive(f)?"":"hidden"}>Скинути</button></div>`;
  }
  function refreshFilters(foc){
    const f = curF(), list = filtered(f);
    const fx = $("#facets"); if (fx) fx.innerHTML = facetsHtml(f);
    if (foc && fx){ const e = [...fx.querySelectorAll("[data-f],[data-ddtoggle]")].find(x=> foc.k ? (x.dataset.f===foc.k && x.dataset.v===foc.v) : x.dataset.ddtoggle===foc.t); if (e) e.focus(); }
    const c = $("#fcount"); if (c) c.textContent = countText(f);
    const r = $("#fResetBtn"); if (r) r.hidden = !isActive(f);
    const pl = $("#prodList"); if (pl) pl.innerHTML = productList(list);
    const vb = document.querySelector(".views"); if (vb && tab==="products") vb.outerHTML = viewsBar(f);
    const pk = $("#pickBox"); if (pk) pk.innerHTML = pickList(list);
    if (tab==="tags") renderPreview();
  }

  // Тост; act = {label, fn} додає кнопку (наприклад «Скасувати») і тримає повідомлення довше
  function toast(t, act){
    const el = $("#toast"), b = $("#toastA");
    $("#toastT").textContent = t;
    b.hidden = !act; el.classList.toggle("has-act", !!act);
    if (act){ b.textContent = act.label; b.onclick = () => { el.classList.remove("show"); clearTimeout(toast._t); act.fn(); }; }
    el.classList.add("show"); clearTimeout(toast._t);
    toast._t = setTimeout(()=>el.classList.remove("show"), act ? 6500 : 2600);
  }
  // Підтвердження без confirm() (у рамці артефакту його немає): перше натискання «заряджає» кнопку, друге — виконує
  function armed(btn, label){
    if (btn.dataset.armed === "1") return true;
    btn.dataset.armed = "1"; btn.dataset.label = btn.textContent; btn.textContent = label; btn.classList.add("armed");
    setTimeout(()=>{ if (btn.isConnected && btn.dataset.armed === "1"){ btn.dataset.armed = ""; btn.textContent = btn.dataset.label; btn.classList.remove("armed"); } }, 4000);
    return false;
  }
  /* ---------- pricing ---------- */
  /* CALC-START */
  // Ціни, маржа, застарілість і беззбитковість. Залежать лише від S.settings і num — їх перевіряють tests/calc.test.js.
  const defMarkup = () => S.settings.defaultMarkup ?? 30;
  function roundPrice(x){ const r = S.settings.rounding ?? 0.5; return Math.round(Math.ceil(x/r - 1e-9)*r*100)/100 || 0; } // до копійки: інакше 1.2000000000000002; || 0: без закупівлі виходить -0
  function priceOf(p){
    if (p.manualPrice && p.price != null) return num(p.price);
    const m = p.markup ?? defMarkup();
    return roundPrice(num(p.cost)*(1+num(m)/100));
  }
  const marginOf = p => { const pr = priceOf(p); return pr>0 ? (pr-num(p.cost))/pr : 0; };
  const staleDays = () => S.settings.staleDays ?? 30;
  // Від якої дати рахуємо застарілість: для товару із закупівлею — коли її востаннє вносили (накладна, таблиця, правка),
  // бо зміна націнки не робить стару закупівельну ціну свіжою; для ручної ціни без закупівлі — коли змінили ціну.
  const checkedAt = p => (num(p.cost)>0 ? p.costAt || p.priceAt : p.priceAt) || null;
  function priceState(p, now = Date.now()){
    if (priceOf(p) <= 0) return "none";
    const at = checkedAt(p), t = at ? Date.parse(at) : NaN;
    if (!isFinite(t)) return "stale";
    return (now-t)/864e5 > staleDays() ? "stale" : "ok";
  }
  // Точка беззбитковості. Продажів у базі ще немає, тож маржа — середня по товарах із закупівлею й ціною (без прикладів).
  // Діапазон beLo–beHi — якщо продаватимуться переважно товари з маржею як у верхньої чи нижньої чверті асортименту.
  function breakEven(products, expenses){
    const sum = fixed => expenses.filter(e=>(e.group==="fixed")===fixed).reduce((s,e)=>s+num(e.amount),0);
    const fixed = sum(true), variable = sum(false), costs = fixed + variable;
    const real = products.filter(p=>!p.example), ms = real.filter(p=>num(p.cost)>0 && priceOf(p)>0).map(marginOf).sort((a,b)=>a-b);
    const n = ms.length, avgM = n ? ms.reduce((s,m)=>s+m,0)/n : 0, q = f => n ? ms[Math.round(f*(n-1))] : 0;
    const lo = q(0.25), hi = q(0.75), per = m => m>0 ? costs/m : 0;

  // Чи треба друкувати цінник: none — немає ціни; new — ще не друкували; changed — ціна змінилась після друку; ok — актуальний
  function tagStatus(p){

  }
  const backupDue = (at, now = Date.now()) => { const t = at ? Date.parse(at) : NaN; return !isFinite(t) || (now-t)/864e5 >= 7; }; // нагадування про копію щотижня
  /* CALC-END */

  /* ---------- db writes ---------- */
  async function write(fn, ok){
    if (!db) { toast("Зміни зараз не зберігаються"); return false; }
    try { await fn(); if (ok) toast(ok); return true; }
    catch(e){
      if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); try{ await fn(); if(ok) toast(ok); return true; }catch(_){} }
      toast(e && e.code==="invalid_argument" ? "Немає прав змінювати дані" : "Не вдалося зберегти, спробуйте ще раз");
      return false;
    }
  }
  const gsSoon = (col, ms = 2500) => { if (col==="products" && S.settings.gsId){ clearTimeout(S.gsSoonT); S.gsSoonT = setTimeout(()=>gsSync(), ms); } };
  const upd = (col,id,data,ok) => write(()=>db.collection(col).doc(id).update(data), ok).then(r=>{ gsSoon(col); return r; });
  const add = (col,data,ok) => write(()=>db.collection(col).add(data), ok).then(r=>{ gsSoon(col); return r; });
  const del = (col,id,ok) => write(async()=>{
    // «надгробок» видаленого товару: лише за ним синхронізація очищує рядок у таблиці, а незнайомий ID не чіпає
    if (col==="products") await db.collection("deletedProducts").doc(id).set({at:today()});
    await db.collection(col).doc(id).delete();
  }, ok).then(r=>{ gsSoon(col); return r; });
  async function setDoc(path,data,ok){ await write(async()=>{ const ref=db.doc(path); const s=await ref.get(); s.exists ? await ref.update(data) : await ref.set(data); }, ok); }

  function saveTag(patch){
    const c = Object.assign(tagCfg(), patch); S.settings.tag = c; renderPreview();
    if (db) setDoc("settings/main", {tag:c});
  }
  function saveStores(n, ok){
    // кількість магазинів (для розрахунку на магазин) лише зростає за списком назв; зменшують її у «Витратах»
    const stores = Math.max(1, num(S.settings.stores) || 1, n.filter(x=>String(x).trim()).length);

  }
  /* ---------- шапка ---------- */
  const fmtDay = d => new Date(d).toLocaleDateString("uk-UA",{day:"numeric",month:"long"});
  const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return a>10 && a<20 ? many : b===1 ? one : b>=2 && b<=4 ? few : many; };
  const nTov = n => `${n} ${plural(n,"товар","товари","товарів")}`;
  function renderChrome(){
    const cn = String(S.settings.chainName || "").trim();
    $("#chainName").textContent = cn && cn.toLowerCase()!=="цукерня" ? cn : "Панель власника мережі";
    // мітка середовища (тестова копія тощо) — задається в базі: settings/main.envLabel
    const env = String(S.settings.envLabel || "").trim(), ep = $("#envPill"); ep.hidden = !env; ep.textContent = env;
    // крапка на вкладці — там є що зробити
    const dots = {today: attention().some(a=>a.sev==="bad"), tags: byTagStatus("changed").length>0, plan: S.ideas.some(i=>!i.reaction)};
    document.querySelectorAll(".tab").forEach(b=>{
      b.setAttribute("aria-selected", b.dataset.tab===tab);

    });

  }

  /* ---------- розділи ---------- */
  const VIEWS_BY_TAB = {today:todayView, products, tags, money:moneyView, plan};
  const OLD_TAB = {overview:"today", tasks:"plan", ideas:"plan", expenses:"money"};
  // Поля, які людина почала заповнювати (змінене значення), переживають перемальовування.
  const formKey = el => el.id ? "#"+el.id : el.dataset.newexp ? `[data-newexp="${el.dataset.newexp}"]` : "";
  const edited = el => el.tagName==="SELECT" ? [...el.options].some(o=>o.selected!==o.defaultSelected) : el.value!==el.defaultValue;
  function render(){
    const a = document.activeElement;
    if (a && $("#main").contains(a) && (a.tagName==="INPUT" || a.tagName==="SELECT") && a.type!=="checkbox") { pending = true; return; }
    pending = false;
    renderChrome();
    const m = $("#main");
    // #q не зберігаємо: пошук і так у стані фільтра, а «Скинути» має його очистити
    const keep = [...m.querySelectorAll("input[id]:not([type=checkbox]):not([type=file]):not(#q), select[id], input[data-newexp]")].filter(edited).map(el=>[formKey(el), el.value]);
    m.innerHTML = VIEWS_BY_TAB[tab]();
    keep.forEach(([k, v])=>{ const el = k && m.querySelector(k); if (el) el.value = v; });
    if (tab==="tags") renderPreview();
  }
  // Знімки бази приходять пачками (імпорт, синхронізація) — перемальовуємо раз на кадр.
  let renderQ = 0;
  const renderSoon = () => { if (!renderQ) renderQ = requestAnimationFrame(()=>{ renderQ = 0; render(); }); };
  // Відкладене перемальовування — після кліку, а не між натисканням і відпусканням кнопки (інакше кнопку замінить і клік загубиться).

  let pointer = false;
  const afterPointer = () => { pointer = false; if (pending) render(); };

  /* ---------- Сьогодні ---------- */
  const totals = () => breakEven(S.products, S.expenses);
  const targetM = () => num(S.settings.targetMargin ?? 20) / 100;
  const lowMargin = p => num(p.cost)>0 && priceOf(p)>0 && marginOf(p) < targetM();
  const ICON = {
    check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
    alert:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 16.5v.5"/></svg>`,
    save:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14"/></svg>`,
    x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6.5 6.5 11 11m0-11-11 11"/></svg>`,
    search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>`,
    plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`
  };
  const viewBtn = (v, label = "Показати") => `<button class="btn soft" data-act="view" data-view="${v}">${label}</button>`;
  // Що потребує уваги власника, від найважливішого; кожен пункт — з дією
  function attention(){
    const items = [], P = S.products, y = S.sync || {}, count = f => P.filter(f).length;
    if (S.settings.gsId && y.error) items.push({sev:"bad", n:ICON.alert, t:"Синхронізація з таблицею не вдалася", d:y.error, a:`<button class="btn soft" data-act="gsSyncNow" ${mcp?"":"disabled"}>Спробувати зараз</button>`});
    const noPrice = count(p=>priceOf(p)<=0);
    if (noPrice) items.push({sev:"bad", n:noPrice, t:`${nTov(noPrice)} без ціни`, d:"Для них не надрукувати цінник. Впишіть закупівлю з націнкою або ціну продажу.", a:viewBtn("noprice")});
    const reprint = byTagStatus("changed").length;
    if (reprint) items.push({sev:"warn", n:reprint, t:`Передрукувати ${reprint} ${plural(reprint,"цінник","цінники","цінників")}`, d:"Ціна змінилась після останнього друку чи PDF.", a:`<button class="btn accent" data-act="goReprint">Вибрати</button>`});
    const stale = count(p=>priceState(p)==="stale");
    if (stale) items.push({sev:"warn", n:stale, t:`${nTov(stale)} із застарілою ціною`, d:`Закупівлю не оновлювали понад ${staleDays()} днів — звірте з останньою накладною.`, a:viewBtn("stale")});
    const low = count(lowMargin);
    if (low) items.push({sev:"warn", n:low, t:`${nTov(low)} з маржею нижче ${Math.round(targetM()*100)} %`, d:"Ціна ледь покриває закупівлю. Перевірте націнку.", a:viewBtn("lowmargin")});
    const noCost = count(p=>!p.example && num(p.cost)<=0 && priceOf(p)>0);
    if (noCost) items.push({sev:"info", n:noCost, t:`${nTov(noCost)} без закупівельної ціни`, d:"Для них не порахувати маржу, тож вони не входять у беззбитковість.", a:viewBtn("nocost")});
    const fresh = S.ideas.filter(i=>!i.reaction).length;
    if (fresh) items.push({sev:"info", n:fresh, t:`${fresh} ${plural(fresh,"ідея чекає","ідеї чекають","ідей чекають")} відповіді`, d:"Відповідайте «Так» або «Не зараз» — я розпишу план для цікавих.", a:`<button class="btn soft" data-go="plan" data-anchor="ideas">Відповісти</button>`});
    const nw = byTagStatus("new").length;
    if (nw) items.push({sev:"info", n:nw, t:`${nTov(nw)} ще без цінника`, d:"З панелі для них цінник ще не друкували.", a:`<button class="btn soft" data-act="goNewTags">Вибрати</button>`});
    const hid = S.allProducts.filter(p=>p.hidden).length;

  /* ---------- PDF (без бібліотек: малюємо аркуші на canvas і пакуємо в PDF) ---------- */
  const PX_MM = 300/25.4, PT = 300/72;
  function wrapText(ctx, text, maxW, maxLines){
    const words = String(text).split(/\s+/), lines = []; let cur = "";

      if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
    }

      lines.length = maxLines-1; lines.push(last+"…");
    }
    // слово, ширше за рядок (назва без пробілів), обрізаємо — інакше воно налазить на сусідній цінник
    return lines.map(l=>{ if (ctx.measureText(l).width <= maxW) return l; let v = l.replace(/…$/, ""); while (v.length>1 && ctx.measureText(v+"…").width > maxW) v = v.slice(0,-1); return v+"…"; });
  }
  function fscale(c){ const f=+c.font||1; return {n:f, g:+(1+(f-1)*0.35).toFixed(3), q:+(1+(f-1)*0.6).toFixed(3)}; }
  function drawTag(ctx, x, y, p, c, fx = 1){
    const [wm, hm] = TAG_SIZES[c.size] || TAG_SIZES.s, k = c.size==="l" ? 1.65 : c.size==="m" ? 1.25 : 1;
    const w = wm*PX_MM, h = hm*PX_MM, padX = 3*k*PX_MM, padY = 2*k*PX_MM, iw = w-2*padX;
    const F = 'Rubik, Arial, sans-serif', t = tagParts(p, c), FS = fscale(c), pt = (v,g) => v*k*(g||FS.g)*fx*PT;
    ctx.save();
    if (c.border!=="none"){
      if (c.border==="dash") ctx.setLineDash([PX_MM*1.2, PX_MM*0.8]);
      ctx.lineWidth = 2; ctx.strokeStyle = c.border==="solid" ? "#555" : "#999"; ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
    } else { ctx.lineWidth = 1; ctx.strokeStyle = "#eee"; ctx.strokeRect(x, y, w, h); }

    const fit = (txt, maxW) => { let v = String(txt); if (ctx.measureText(v).width <= maxW) return v; while (v.length>1 && ctx.measureText(v+"…").width > maxW) v = v.slice(0,-1); return v+"…"; };

      if (t.hr){ ctx.textAlign = "right"; ctx.fillText(fit(t.hr, rw+1), x+w-padX, ty); }
      ty += pt(7)*1.25;
    }
    ctx.textAlign = "left";
    if (t.custom){ ctx.fillStyle = "#c2185b"; ctx.font = `700 ${pt(8)}px ${F}`; ty += 0.5*PX_MM; ctx.fillText(fit(t.custom, iw), x+padX, ty); ty += pt(8)*1.2; }
    if (t.name){
      const ns = c.nameBig ? 12.5 : 10;
      ctx.fillStyle = "#1c1c1c"; ctx.font = `600 ${pt(ns,FS.n)}px ${F}`; ty += 0.8*PX_MM;

    }
    if (t.pack){ ctx.fillStyle = "#555"; ctx.font = `400 ${pt(7.5)}px ${F}`; ty += 0.5*PX_MM; ctx.fillText(fit(t.pack, iw), x+padX, ty); ty += pt(7.5)*1.2; }
    const topEnd = ty;
    // низ (знизу вгору)
    let by = y+h-padY;
    if (t.fl || t.fr){
      ctx.fillStyle = "#777"; ctx.font = `400 ${pt(7)}px ${F}`; by -= pt(7)*1.2;
      if (t.fl){ ctx.textAlign = "left"; ctx.fillText(fit(t.fl, t.fr ? iw*0.62 : iw), x+padX, by); }
      if (t.fr){ ctx.textAlign = "right"; ctx.fillText(t.fr, x+w-padX, by); }
      ctx.textAlign = "left";
    }
    if (t.unit){ ctx.fillStyle = "#444"; ctx.font = `400 ${pt(8,FS.n)}px ${F}`; by -= pt(8,FS.n)*1.3; ctx.fillText(fit(t.unit, iw), x+padX, by); }

  function pdfFromJpegs(pages){
    const enc = new TextEncoder(), parts = [], offs = []; let len = 0;

    const PW = 595.28, PH = 841.89, n = pages.length;
    put("%PDF-1.4\n");
    offs[1] = len; put("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    offs[2] = len; put(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(" ")}] >>\nendobj\n`);
    pages.forEach((pg,i)=>{
      const pid = 3+3*i, cid = pid+1, iid = pid+2, content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
      offs[pid] = len; put(`${pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
      offs[cid] = len; put(`${cid} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
      offs[iid] = len; put(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);
      put(pg.bytes); put("\nendstream\nendobj\n");
    });
    const total = 3+3*n, xref = len;
    put(`xref\n0 ${total}\n0000000000 65535 f \n` + offs.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
    put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, {type:"application/pdf"});
  }

  function parseCsv(text){

    for (let i=0; i<text.length; i++){
      const ch = text[i];
      if (q){ if (ch==='"'){ if (text[i+1]==='"'){ cur += '"'; i++; } else q = false; } else cur += ch; }

    const lastRow = rows.reduce((m, r, i) => (r && r.some(v=>String(v ?? "").trim()!=="")) ? i+1 : m, 1);
    const plan = {header: hdrChanged ? newHdr : null, last, width, lastRow, rowWrites:[], appends:[], clears:[], dbUpdates:[], dbAdds:[], hides:[], n:0, added:0, changed:0, pushed:0};
    const byId = new Map(all.map(p=>[p.id, p]));
    // Таблицю веде інша панель (більшість ID чужі): не забираємо її рядки й не переписуємо ID, бо це зламає ту панель. Лише за явною згодою.
    const ids = rows.slice(1).filter(r=>r && cell(r,"name")).map(r=>cell(r,"id").replace(/^'/,"")).filter(Boolean);
    const foreign = ids.filter(id=>!byId.has(id) && !(env.deleted && env.deleted.has(id))).length;
    if (!env.adoptForeign && foreign >= 3 && foreign*2 > ids.length)
      return {error:`Схоже, цю таблицю веде інша панель: ${foreign} з ${ids.length} товарів у ній мають ID, яких тут немає. Синхронізацію зупинено, щоб не зіпсувати ту панель.`, foreign};
    const claimed = new Set(), pending = [];

      const s = fromSheet(r), a = fromApp(p), b = p.gsBase || null, m = {};

        if (!b) m[k] = (s[k]==="" || s[k]==="0") && a[k]!=="" && a[k]!=="0" ? a[k] : s[k];
        else if (s[k]!==b[k] && a[k]===b[k]) m[k] = s[k];
        else if (a[k]!==b[k] && s[k]===b[k]) m[k] = a[k];
        else if (s[k]!==b[k] && a[k]!==b[k]) m[k] = s[k];
        else m[k] = a[k];
      }
      if (!m.name) m.name = a.name;
      if (m.markup==="") m.markup = n2(def);
      let patch = null;
      if (!same(m, a) || p.hidden){ patch = toPatch(m, p); if (p.hidden) patch.hidden = false; plan.changed++; }
      if (!b || !same(m, b)){ patch = patch || {}; patch.gsBase = m; }
      if (patch) plan.dbUpdates.push({id:p.id, patch});
      const after = Object.assign({}, p, patch || {});
      const out = rowOut(m, p.id, env.priceOf(after), after.priceAt || "");
      if (!same(m, s) || !calcSame(r, out)){ plan.rowWrites.push({row:i+1, values:out}); if (!same(m, s)) plan.pushed++; }
    };
    rows.forEach((r, i) => {
      if (i===0 || !r || !cell(r,"name")) return;
      plan.n++;
      const id = cell(r,"id").replace(/^'/,"");
      if (id && byId.has(id) && !claimed.has(id)){ claimed.add(id); handle(r, i, byId.get(id)); return; }
      if (id && !byId.has(id) && env.deleted && env.deleted.has(id)){ plan.clears.push(i+1); plan.n--; return; } // товар видалили в застосунку
      pending.push([r, i]); // без ID або з незнайомим ID (рядок зі старої копії, зіпсований ID): шукаємо за назвою або додаємо як новий
    });
    const byName = new Map(); all.forEach(p=>{ if (!claimed.has(p.id) && !p.hidden){ const k = env.norm(p.name); if (!byName.has(k)) byName.set(k, p); } });
    for (const [r, i] of pending){
      const k = env.norm(cell(r,"name")), p = byName.get(k);
      if (p){ byName.delete(k); claimed.add(p.id); handle(r, i, p); continue; }
      const s = fromSheet(r); if (s.markup==="") s.markup = n2(def);
      const id = env.newId(), data = toPatch(s, null);
      data.gsBase = s; if (!(+s.cost>0 || +s.price>0)) delete data.priceAt;
      plan.dbAdds.push({id, data}); plan.added++;
      plan.rowWrites.push({row:i+1, values:rowOut(s, id, env.priceOf(data), data.priceAt || "")});
    }
    for (const p of all){
      if (claimed.has(p.id) || p.hidden) continue;
      if (p.gsBase){ plan.dbUpdates.push({id:p.id, patch:{hidden:true}}); continue; } // рядок видалили в таблиці
      const a = fromApp(p);
      plan.appends.push(rowOut(a, p.id, env.priceOf(p), p.priceAt || ""));
      plan.dbUpdates.push({id:p.id, patch:{gsBase:a}});

  }

  /* SYNC-RUNNER-START */
  const SHEETS = "Google Sheets";
  const sheets = (tool, input) => mcp.callTool(SHEETS, tool, input, {cache:false}).then(pj);
  function sheetsErr(e){
    const c = e && e.code;
    if (c==="server_not_connected") return "Google Sheets не підключений до вашого акаунта Claude. Підключіть його в налаштуваннях конекторів.";
    if (c==="needs_reauth") return "Потрібно заново підключити Google Sheets у налаштуваннях Claude.";
    if (c==="consent_required" || c==="approval_required") return "Дозвольте сторінці працювати з Google Sheets, коли з’явиться запит.";
    if (c==="rate_limited") return "Забагато запитів до Google. Спробую ще раз за хвилину.";
    if (c==="tool_error") return "Google Sheets відповів помилкою (можливо, немає доступу до таблиці).";
    return "Не вдалося зв’язатися з Google Sheets. Спробую ще раз за хвилину.";
  }
  const clean = o => JSON.parse(JSON.stringify(o));
  // Замок у базі: синхронізує лише одна вкладка чи пристрій водночас, інакше новий рядок таблиці стає двома товарами.
  const SYNC_HOLDER = Math.random().toString(36).slice(2) + Date.now().toString(36), SYNC_TTL = 60000;
  async function syncLease(ttlMs){
    const ref = db.doc("sync/lock");
    if (typeof ref.acquire !== "function") return {acquired:true}; // середовище без замків — як раніше
    try{ return await ref.acquire({holder:SYNC_HOLDER, ttlMs}); }
    catch(e){
      if (e && (e.code==="capability_removed" || e.code==="capability_disabled")) return {acquired:true};
      if (e && e.code==="invalid_argument") throw {sheetErr:"Немає прав змінювати дані, тому синхронізацію з таблицею тут не запускаю."};
      throw {sheetErr:"Не вдалося перевірити, чи не синхронізує зараз інший пристрій. Спробую ще раз за хвилину."};
    }
  }
  async function gsSync(){
    const id = S.settings.gsId; if (!id || !mcp || !db) return;
    const y = S.sync || (S.sync = {});
    if (y.busy){ y.again = true; return; }
    y.busy = true; y.error = null; y.waiting = false; y.foreign = 0; updateSyncUi();
    let held = false;
    try{
      const lease = await syncLease(SYNC_TTL);
      if (!lease.acquired){ // синхронізує інша вкладка чи пристрій — повторимо, щойно звільнить
        y.waiting = true; y.again = false;
        const wait = Math.min(65000, Math.max(2000, (Date.parse(lease.expiresAt) || 0) - Date.now() + 500));
        clearTimeout(S.syncRetryT); S.syncRetryT = setTimeout(gsSync, wait + Math.random()*1500);
        return;
      }
      held = true; let leaseAt = Date.now();
      const keep = async () => { // подовжуємо замок на довгих синхронізаціях
        if (Date.now() - leaseAt < SYNC_TTL/3) return;
        if (!(await syncLease(SYNC_TTL)).acquired) throw {sheetErr:"Синхронізацію перехопив інший пристрій. Спробую ще раз за хвилину."};
        leaseAt = Date.now();
      };
      const d = await sheets("get_values", {spreadsheetId:id, range:"A:Z"});
      // Товари читаємо з бази заново, а не з S.allProducts: знімок може ще не мати товарів, які щойно додав інший пристрій
      const all = (await db.collection("products").get()).docs.map(x=>({id:x.id, ...x.data()}));
      const deleted = new Set((await db.collection("deletedProducts").get()).docs.map(x=>x.id));
      const plan = planSync(d && Array.isArray(d.values) ? d.values : [], all, {
        defMarkup:defMarkup(), priceOf, norm, parseNum, unitNorm, packNorm, today:today(), deleted, adoptForeign:!!S.settings.gsAdopt,
        newId:()=>db.collection("products").doc().id || ("g"+Date.now().toString(36)+Math.random().toString(36).slice(2,7))});
      if (plan.error) throw {sheetErr:plan.error, foreign:plan.foreign || 0};
      const L = plan.last;
      // 1) нові товари з таблиці — у застосунок (щоб їхні ID вже існували)
      for (const a of plan.dbAdds){ await keep(); await db.collection("products").doc(a.id).set(clean(a.data)); }
      // 2) записи в таблицю
      await keep();
      if (plan.header) await sheets("update_values", {spreadsheetId:id, range:`A1:${L}1`, values:[plan.header]});
      if (plan.rowWrites.length){ // один запит на всі змінені рядки: незмінені рядки — null (Google їх пропускає)
        const lo = Math.min(...plan.rowWrites.map(w=>w.row)), hi = Math.max(...plan.rowWrites.map(w=>w.row));
        const block = Array.from({length:hi-lo+1}, ()=>new Array(plan.width).fill(null));
        plan.rowWrites.forEach(w=>{ block[w.row-lo] = w.values; });
        await sheets("update_values", {spreadsheetId:id, range:`A${lo}:${L}${hi}`, values:block});
      }
      if (plan.appends.length){ // дописуємо під останнім заповненим рядком (append_values Google може «вставити» посеред таблиці)
        const at = plan.lastRow + 1;

      }
      if (plan.clears.length) await sheets("batch_clear_values", {spreadsheetId:id, ranges:plan.clears.map(r=>`A${r}:${L}${r}`)});
      // 3) зміни з таблиці — у застосунок
      for (const u of plan.dbUpdates){ await keep(); await db.collection("products").doc(u.id).update(clean(u.patch)); }
      Object.assign(y, {at:Date.now(), n:plan.n, added:plan.added, upd:plan.changed, pushed:plan.pushed + plan.appends.length});
      if (S.settings.gsAdopt){ S.settings.gsAdopt = false; await db.doc("settings/main").update({gsAdopt:false}); } // згода одноразова: далі захист знову діє
    }catch(e){ y.foreign = (e && e.foreign) || 0; y.error = (e && e.sheetErr) ? e.sheetErr : /quota|rate/i.test(String(e && (e.message||""))) ? "Google тимчасово обмежив кількість запитів. Спробую ще раз за хвилину." : sheetsErr(e); }
    finally{
      if (held) await syncLease(1000).catch(()=>{}); // звільняємо замок: окремої команди немає, тож коротшаємо строк до 1 с
      y.busy = false; updateSyncUi();
      if (y.again){ y.again = false; setTimeout(gsSync, 3000); }
    }
  }
  /* SYNC-RUNNER-END */
  function syncSetup(){
    clearInterval(S.syncT);

  /* ---------- видалення зі «Скасувати» ---------- */
  // У рамці артефакту немає confirm(), тож видаляємо одразу й даємо кілька секунд, щоб повернути
  const dataOf = x => { const d = clean(Object.assign({}, x)); delete d.id; return d; };
  async function removeWithUndo(col, ids, msg){
    const list = col==="products" ? S.allProducts : (S[col] || []);
    const pairs = ids.map(id=>list.find(x=>x.id===id)).filter(Boolean).map(x=>[x.id, dataOf(x)]);
    if (!pairs.length) return;
    const ok = await write(async()=>{ for (const [id] of pairs){
      if (col==="products") await db.collection("deletedProducts").doc(id).set({at:today()}); // «надгробок» для синхронізації
      await db.collection(col).doc(id).delete(); } });
    if (!ok) return;
    if (col==="products") gsSoon(col, 7500); // таблицю чіпаємо, коли «Скасувати» вже зникне
    toast(msg, {label:"Скасувати", fn:()=>restore(col, pairs)});
  }
  async function restore(col, pairs){
    await write(async()=>{ for (const [id, data] of pairs){
      if (col==="products"){ await db.collection(col).doc(id).set(Object.assign({}, data, {gsBase:null})); await db.collection("deletedProducts").doc(id).delete(); } // gsBase:null — рядок допишеться в таблицю
      else await db.collection(col).doc(id).set(data); } }, "Повернено");
    if (col==="products") gsSoon(col);
  }
  async function applyBulk(){
    const b = S.bulk || {}, m = num(b.m ?? defMarkup()), scope = b.scope || "", list = bulkList(scope);
    if (!list.length || !db) return;
    const prev = list.map(p=>[p.id, {markup:p.markup ?? null, manualPrice:!!p.manualPrice, price:p.price ?? null, priceAt:p.priceAt ?? null}]), prevDef = S.settings.defaultMarkup ?? null;
    S.panel = null; S.bulk = null; render();
    const ok = await write(async()=>{ for (const p of list) await db.collection("products").doc(p.id).update({markup:m, manualPrice:false, price:null, priceAt:today()}); if (!scope) await setDoc("settings/main", {defaultMarkup:m}); });
    if (!ok) return;
    gsSoon("products");
    toast(`Націнка ${m} % — для ${nTov(list.length)}`, {label:"Скасувати", fn:async()=>{
      await write(async()=>{ for (const [id, d] of prev) await db.collection("products").doc(id).update(d); if (!scope) await setDoc("settings/main", {defaultMarkup:prevDef ?? 30}); }, "Попередні ціни повернено");
      gsSoon("products"); }});
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e=>{
    if (S.openF && !e.target.closest(".dd")){ S.openF = null; const fx = $("#facets"); if (fx) fx.innerHTML = facetsHtml(curF()); } // фільтр не змінився — списки не чіпаємо
    const g = e.target.closest("[data-go]");
    if (g){ e.preventDefault(); if (g.dataset.anchor==="hidden") S.openHidden = true; go(g.dataset.go, g.dataset.anchor); return; }
    const t = e.target.closest("button"); if(!t) return;
    if (t.dataset.gsid){ gsPick(t.dataset.gsid, t.dataset.gst, t.dataset.gsu); return; }
    if (t.dataset.ddtoggle!==undefined){ const k = t.dataset.ddtoggle; S.openF = S.openF===k ? null : k; refreshFilters({t:k}); return; }
    if (t.dataset.fclear!==undefined){ curF()[t.dataset.fclear].clear(); refreshFilters({t:t.dataset.fclear}); return; }
    if (t.dataset.view && !t.dataset.act){ const f = S.F.prod; f.view = f.view===t.dataset.view ? "all" : t.dataset.view; refreshFilters(); return; }
    if (t.dataset.popen){ S.openProd = S.openProd===t.dataset.popen ? null : t.dataset.popen; render(); const ed = $("#pedit"); if (ed) ed.querySelector("input").focus(); return; }
    if (t.dataset.cycle){ const k=S.tasks.find(x=>x.id===t.dataset.cycle); upd("tasks",k.id,{status:ST_NEXT[k.status||"todo"]}); return; }
    if (t.dataset.delTask){ removeWithUndo("tasks", [t.dataset.delTask], "Задачу видалено"); return; }
    if (t.dataset.react!==undefined && t.dataset.react){ upd("ideas",t.dataset.react,{reaction:t.dataset.v||null}, t.dataset.v==="yes"?"Записав: беремо в роботу":t.dataset.v==="no"?"Записав: відкладаємо":null); return; }
    if (t.dataset.delProd || t.dataset.purge){ const id = t.dataset.delProd || t.dataset.purge, p = S.allProducts.find(x=>x.id===id);
      if (S.openProd===id) S.openProd = null;
      removeWithUndo("products", [id], `«${p ? p.name : "Товар"}» видалено`); return; }
    // gsBase:null — синхронізація вважатиме товар новим для таблиці й допише його рядок, а не сховає знову
    if (t.dataset.unhide){ upd("products",t.dataset.unhide,{hidden:false,gsBase:null},"Товар повернено"); return; }
    if (t.dataset.delExp){ removeWithUndo("expenses", [t.dataset.delExp], "Статтю витрат видалено"); return; }
    const a = t.dataset.act;
    if (a==="addTask"){ const v=$("#newTask").value.trim(); if(!v) return; const st=+$("#newTaskStage").value; $("#newTask").value = "";
      add("tasks",{title:v,stage:st,status:"todo",order:Date.now()},"Задачу додано"); }
    if (a==="addIdea"){ const v=$("#newIdea").value.trim(); if(!v) return; $("#newIdea").value = ""; add("ideas",{title:v,text:"Ідея власника",reaction:"yes",order:Date.now(),byOwner:true},"Ідею записано"); }
    if (a==="clearEx"){ const ids = S.products.filter(p=>p.example).map(p=>p.id); removeWithUndo("products", ids, `Приклади прибрано: ${ids.length}`); }
    if (a==="bulk"){ applyBulk(); }
    if (a==="panel"){ S.panel = t.dataset.panel || null; if (S.panel==="bulk") S.bulk = {m:defMarkup(), scope:""}; if (S.panel!=="import"){ S.impDone = null; }
      render(); const f = S.panel==="add" ? $("#npName") : S.panel==="bulk" ? $("#bulkM") : null; if (f) f.focus(); }
    if (a==="view"){ S.F.prod = newF(); S.F.prod.view = t.dataset.view; S.panel = null; go("products"); }
    if (a==="goReprint" || a==="goNewTags"){ const ids = byTagStatus(a==="goReprint" ? "changed" : "new").map(p=>p.id); S.tagSel = new Set(ids); S.F.tags = newF(); go("tags"); toast(`Вибрано ${nTov(ids.length)} — перевірте кількість і завантажте PDF`); }
    if (a==="addProd"){ const n=$("#npName").value.trim(); if(!n){ $("#npName").focus(); return; }
      const cost=num($("#npCost").value); add("products",{name:n,type:$("#npType").value,category:$("#npCat").value.trim(),pack:$("#npPack").value||null,size:$("#npSize").value.trim()||null,unit:$("#npUnit").value,cost,markup:num($("#npMarkup").value),manualPrice:false,priceAt:cost>0?today():null,costAt:cost>0?today():null},`«${n}» додано`);
      ["#npName","#npSize","#npCost"].forEach(k=>{ $(k).value = ""; }); $("#npName").focus(); }
    if (a==="selShown"){ filtered(S.F.tags).forEach(p=>S.tagSel.add(p.id)); syncChecks(); renderPreview(); }
    if (a==="unselShown"){ filtered(S.F.tags).forEach(p=>S.tagSel.delete(p.id)); syncChecks(); renderPreview(); }
    if (a==="qtyAll"){ const v = Math.max(1, Math.min(500, Math.round(num($("#qtyAll").value)))); if (!S.tagSel.size){ toast("Спершу позначте товари"); return; } S.tagSel.forEach(id=>{ S.tagQty[id] = v; }); syncChecks(); renderPreview(); toast(`Кожному вибраному — по ${v} шт`); }
    if (a==="selNone"){ S.tagSel.clear(); syncChecks(); renderPreview(); }
    if (a==="fReset"){ S.F[tab==="tags"?"tags":"prod"] = newF(); S.openF = null; render(); }
    if (a==="dlPdf"){ makePdf(t); }
    if (a==="backup"){ backupJson(t); }
    if (a==="addStore"){ const n = storeNames().slice(); n.push(""); saveStores(n); setTimeout(()=>{ const i = document.querySelector(`[data-store="${n.length-1}"]`); if (i) i.focus(); }, 60); }
    if (a==="delStore"){ const i = +t.dataset.i, n = storeNames().slice(), prev = n.slice(), nm = n[i], c = tagCfg();
      n.splice(i,1); saveStores(n);
      if (i < c.storeIdx) saveTag({storeIdx:c.storeIdx-1}); else if (c.storeIdx >= n.length) saveTag({storeIdx:Math.max(0,n.length-1)});
      toast(nm ? `Магазин «${nm}» видалено` : "Магазин видалено", {label:"Скасувати", fn:()=>{ saveStores(prev, "Повернено"); saveTag({storeIdx:c.storeIdx}); }}); }
    if (a==="pickFile"){ $("#impFile").click(); }
    if (a==="impCancel"){ S.imp = null; renderImport(); }
    if (a==="impGo"){ S.impDone = null; applyImport(); }
    if (a==="impDoneClose"){ S.impDone = null; S.panel = null; render(); }
    if (a==="impTags"){ const ids = S.impDone ? S.impDone.changed : []; S.tagSel = new Set(ids); ids.forEach(id=>{ S.tagQty[id] = S.tagQty[id] || 1; }); S.F.tags = newF(); go("tags"); toast(`Вибрано ${nTov(ids.length)} — перевірте кількість і завантажте PDF`); }
    if (a==="tplXlsx"){ tplXlsx(); }
    if (a==="gsOpen"){ S.gs = {mode:"import", q:"", files:null}; renderGs(); gsSearch(); }
    if (a==="gsLinkOpen"){ S.gs = {mode:"link", q:"", files:null}; renderGs(); gsSearch(); }
    if (a==="gsLinkNew"){ gsCreateBase(t); }
    if (a==="gsSyncNow"){ gsSync(); }
    if (a==="gsUnlink"){ if (!armed(t, "Точно відключити?")) return; setDoc("settings/main", {gsId:null, gsTitle:null, gsUrl:null}, "Таблицю відключено. Товари лишилися тут.").then(()=>{ S.sync = null; }); }
    if (a==="gsAdopt"){ if (!armed(t, "Так, забрати товари")) return; setDoc("settings/main", {gsAdopt:true}).then(()=>{ S.settings.gsAdopt = true; gsSync(); }); }
    if (a==="gsSearch"){ gsSearch(); }
    if (a==="gsClose"){ S.gs = null; renderGs(); }
    if (a==="dlCsv"){ const list = selectedProducts(); save(`tsinnyky-${today()}.csv`, csv(list)).then(ok=>{ if (ok) markPrinted(list); }); }
    if (a==="selTagSt"){ const ids = byTagStatus(t.dataset.st).map(p=>p.id); S.tagSel = new Set(ids); syncChecks(); renderPreview(); toast(`Вибрано ${nTov(ids.length)}`); }
    if (a==="addExp"){ const g=t.dataset.g, inp=document.querySelector(`[data-newexp="${g}"]`), v=inp.value.trim(); if(!v){ inp.focus(); return; } inp.value = "";
      add("expenses",{name:v,group:g,amount:0,order:Date.now()},"Статтю додано — впишіть суму"); }
  });
  // Розгорнуті розділи (вигляд цінника, приховані товари) лишаються розгорнутими після перемальовування
  document.addEventListener("toggle", e=>{ const d = e.target; if (d.id==="builder") S.openBuilder = d.open; if (d.classList && d.classList.contains("hid")) S.openHidden = d.open; }, true);
  // Підказки до графіків: наведення мишею або фокус з клавіатури
  const tip = $("#ctip");
  const showTip = (el, x, y) => { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width/2)) + "px"; tip.style.top = Math.max(8, y - r.height - 12) + "px"; };
  document.addEventListener("mousemove", e=>{ const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else if (!tip.hidden && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-tip]"))) tip.hidden = true; });
  document.addEventListener("focusin", e=>{ const el = e.target.closest && e.target.closest("[data-tip]"); if (el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width/2, r.top); } else tip.hidden = true; });
  document.addEventListener("change", e=>{
    const el = e.target;
    if (el.dataset.f!==undefined){ const st = curF()[el.dataset.f], v = el.dataset.v; el.checked ? st.add(v) : st.delete(v); refreshFilters({k:el.dataset.f, v}); return; }
    if (el.dataset.ptype!==undefined){ upd("products",el.dataset.id,{type:el.value||null}); return; }
    if (el.dataset.punit!==undefined){ upd("products",el.dataset.id,{unit:el.value||"шт"}); return; }
    if (el.dataset.ppack!==undefined){ upd("products",el.dataset.id,{pack:el.value||null}); return; }
    if (el.dataset.psize!==undefined){ upd("products",el.dataset.id,{size:el.value.trim()||null}); return; }
    if (el.dataset.pname!==undefined){ const v = el.value.trim(); if (v) upd("products",el.dataset.id,{name:v},"Назву змінено"); else el.value = el.defaultValue; return; }
    if (el.dataset.pcat!==undefined){ upd("products",el.dataset.id,{category:el.value.trim()}); return; }
    if (el.id==="defMk"){ setDoc("settings/main",{defaultMarkup:num(el.value)},"Націнку за замовчуванням змінено"); return; }
    if (el.id==="targetMk"){ setDoc("settings/main",{targetMargin:Math.max(0, Math.min(90, num(el.value)))},"Цільову маржу змінено"); return; }
    if (el.id==="staleRule"){ setDoc("settings/main",{staleDays:+el.value},"Термін застарілості змінено"); return; }
    if (el.id==="bulkC"){ S.bulk = Object.assign(S.bulk || {}, {scope:el.value}); const bx = $("#bulkBox"); if (bx) bx.outerHTML = bulkPanel(); return; }
    if (el.id==="staleDays"){ S.settings.staleDays = +el.value; refreshFilters(); setDoc("settings/main",{staleDays:+el.value},"Термін застарілості змінено"); return; }
    if (el.id==="impFile"){ const f = el.files[0]; el.value = ""; handleFile(f); return; }
    if (el.id==="impMarkup" && S.imp){ S.imp.markup = num(el.value); renderImport(); return; }
    if (el.id==="impType" && S.imp){ S.imp.defType = el.value; renderImport(); return; }
    if (el.id==="impGen" && S.imp){ S.imp.genericAs = el.value; renderImport(); return; }
    if (el.dataset.pf){ const p=S.products.find(x=>x.id===el.dataset.id); if(!p) return; const v=num(el.value);
      if (el.dataset.pf==="price"){ // порожня ціна — як у таблиці: рахується із закупівлі й націнки
        if (el.value.trim()==="") upd("products",p.id,{price:null,manualPrice:false,priceAt:today()},"Ціна рахується з націнки");
        else upd("products",p.id,{price:v,manualPrice:true,priceAt:today()}); }
      else if (el.dataset.pf==="markup") upd("products",p.id,{markup:v,manualPrice:false,price:null,priceAt:today()});
      else upd("products",p.id,{cost:v,priceAt:today(),costAt:today()}); return; }
    if (el.dataset.exp){ upd("expenses",el.dataset.exp,{amount:num(el.value)}); return; }
    if (el.dataset.qty){ const id = el.dataset.qty, v = Math.round(num(el.value));
      if (v <= 0){ S.tagSel.delete(id); S.tagQty[id] = 1; } else { S.tagQty[id] = Math.min(500, v); S.tagSel.add(id); }
      syncChecks(); renderPreview(); return; }
    if (el.dataset.tag){ el.checked ? S.tagSel.add(el.dataset.tag) : S.tagSel.delete(el.dataset.tag); syncChecks(); renderPreview(); return; }
    if (el.dataset.tc){ saveTag({[el.dataset.tc]: el.checked}); return; }
    if (el.id==="tcSize"){ saveTag({size:el.value}); return; }
    if (el.id==="tcFont"){ saveTag({font:+el.value}); return; }
    if (el.id==="tcBorder"){ saveTag({border:el.value}); return; }
    if (el.id==="tcStore"){ saveTag({storeIdx:+el.value}); return; }
    if (el.id==="tcCustom"){ saveTag({custom:el.value.trim().slice(0,40)}); return; }
    if (el.id==="chainIn"){ const v = el.value.trim(); S.settings.chainName = v; renderPreview(); setDoc("settings/main",{chainName:v||"Мережа солодощів"},"Назву мережі збережено"); return; }
    if (el.dataset.store!==undefined){ const n = storeNames().slice(); n[+el.dataset.store] = el.value.trim(); saveStores(n, "Назву магазину збережено"); return; }
    if (el.id==="rounding"){ setDoc("settings/main",{rounding:num(el.value)},"Округлення змінено"); }
    if (el.id==="stores"){ setDoc("settings/main",{stores:Math.max(1,Math.round(num(el.value)))}); }
  });
  document.addEventListener("input", e=>{
    if (e.target.id==="tcCustom"){ S.settings.tag = Object.assign(tagCfg(), {custom:e.target.value}); renderPreview(); return; }
    if (e.target.id==="bulkM"){ S.bulk = Object.assign(S.bulk || {}, {m:num(e.target.value)}); const pv = $("#bulkPrev"); if (pv) pv.innerHTML = bulkPreview(); return; }
    if (e.target.id==="q"){ curF().q = e.target.value; clearTimeout(refreshFilters._t); refreshFilters._t = setTimeout(refreshFilters, 180); }
  });
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape" && S.openF){ const k = S.openF; S.openF = null; refreshFilters({t:k}); return; }
    if (e.key!=="Enter") return;
    if (e.target.dataset && e.target.dataset.qty){ e.target.blur(); return; }
    const map = {qtyAll:"qtyAll", newTask:"addTask", newIdea:"addIdea", npName:"addProd", gsQ:"gsSearch"};
    if (map[e.target.id]) document.querySelector(`[data-act="${map[e.target.id]}"]`).click();
  });

  /* ---------- data ---------- */
  { let t = (location.hash || "").slice(1); if (!VIEWS_BY_TAB[OLD_TAB[t] || t]){ try{ t = localStorage.getItem("tsukenya.tab") || ""; }catch(_){ t = ""; } }
    t = OLD_TAB[t] || t; if (VIEWS_BY_TAB[t]) tab = t; }
  render();
  const noDbTimer = setTimeout(()=>{ if(!db) $("#noDb").hidden=false; }, 4000);
  window.claude?.use?.("downloads").then(d=>{ downloads=d; renderSoon(); }).catch(()=>{});
  window.claude?.use?.("mcp").then(m=>{ mcp=m; renderSoon(); syncSetup(); }).catch(()=>{});
  (window.claude?.use ? window.claude.use("db") : Promise.resolve(null)).then(d=>{
    if(!d){ $("#noDb").hidden=false; clearTimeout(noDbTimer); return; }
    db = d; clearTimeout(noDbTimer); $("#noDb").hidden = true;
    const byOrder = (a,b)=>(a.order??0)-(b.order??0);
    const sub = (col, key, sort) => db.collection(col).onSnapshot(s=>{
      S[key] = s.docs.map(x=>({id:x.id, ...x.data()})).sort(sort); renderSoon();
    }, ()=>{});
    sub("tasks","tasks",(a,b)=>(a.stage-b.stage)||byOrder(a,b));
    sub("ideas","ideas",byOrder);
    db.collection("products").onSnapshot(s=>{
      S.allProducts = s.docs.map(x=>({id:x.id, ...x.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),"uk"));
      S.products = S.allProducts.filter(p=>!p.hidden); renderSoon();
    }, ()=>{});
    sub("expenses","expenses",byOrder);
    db.doc("settings/main").onSnapshot(s=>{ S.settings = s.exists ? s.data() : {}; renderSoon(); syncSetup(); }, ()=>{});
    db.doc("project/state").onSnapshot(s=>{ S.project = s.exists ? s.data() : {}; renderSoon(); }, ()=>{});
  }).catch(()=>{ $("#noDb").hidden=false; });
})();
</script>
